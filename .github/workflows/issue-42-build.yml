name: Issue 42 build idle-pregen

on:
  push:
    branches: [fix/issue-42]
    paths:
      - 'custom-mods/maki-idle-pregen/**'
      - '.github/workflows/issue-42-build.yml'

permissions:
  contents: write

jobs:
  build-and-ship:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-42
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile, check and build
        run: gradle -p custom-mods/maki-idle-pregen clean check jar --stacktrace

      - name: Validate and stage shipped JAR
        run: |
          JAR=custom-mods/maki-idle-pregen/build/libs/maki-idle-pregen-1.1.0.jar
          test -f "$JAR"
          jar tf "$JAR" >/dev/null
          sha256sum "$JAR"
          rm -f mods/maki-idle-pregen-1.0.1.jar
          cp "$JAR" mods/maki-idle-pregen-1.1.0.jar

      - name: Commit rebuilt JAR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/maki-idle-pregen-1.1.0.jar
          if git diff --cached --quiet; then
            echo "No JAR change"
            exit 0
          fi
          git commit -m "build: refresh maki-idle-pregen 1.1.0 [skip ci]"
          git push origin HEAD:fix/issue-42
