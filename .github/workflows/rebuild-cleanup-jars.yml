name: Rebuild cleanup PR deployment JARs

on:
  pull_request:
    paths:
      - 'custom-mods/**'
      - '.github/workflows/rebuild-cleanup-jars.yml'

permissions:
  contents: write

concurrency:
  group: cleanup-jar-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/remove-unreachable-custom-mod-code'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build cache MOD and governor from the current sources
        run: |
          set -euo pipefail
          gradle --build-cache -p custom-mods/maki-lod-cpu clean check jar
          gradle --build-cache -p custom-mods/maki-chunksmith-chunk-cache clean check jar
      - name: Sync the source-backed deployment JARs
        run: |
          set -euo pipefail
          cp custom-mods/maki-lod-cpu/build/libs/maki-lod-cpu-1.4.1.jar mods/
          cp custom-mods/maki-chunksmith-chunk-cache/build/libs/maki-chunksmith-chunk-cache-1.4.0.jar mods/
          git add mods/maki-lod-cpu-1.4.1.jar mods/maki-chunksmith-chunk-cache-1.4.0.jar
          if git diff --cached --quiet; then
            echo "Deployment JARs already match sources."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: sync cleaned custom MOD deployment JARs"
          git push origin "HEAD:refs/heads/${{ github.head_ref }}"
