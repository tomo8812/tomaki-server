name: issue62 source build check
on:
  push:
    branches: [fix/issue-62]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - maki-airship-compat
          - maki-airship-foundation-compat
          - maki-assembly-tracking
          - maki-chunksmith-chunk-cache
          - maki-diorama-share
          - maki-idle-pregen
          - maki-lod-cpu
          - maki-lod-cpu-online-fix
          - maki-millenaire-lod-compat
          - maki-mods-observer
          - maki-ship-anchor-fix
          - maki-ship-edge
          - maki-ship-footsteps
          - maki-ship-save
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build ${{ matrix.project }}
        run: gradle -p custom-mods/${{ matrix.project }} clean check jar --stacktrace
