name: issue62 source build check
on:
  push:
    branches: [fix/issue-62]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build every maintained custom MOD
        shell: bash
        run: |
          set -euxo pipefail
          projects=(
            maki-airship-compat
            maki-airship-foundation-compat
            maki-assembly-tracking
            maki-chunksmith-chunk-cache
            maki-diorama-share
            maki-idle-pregen
            maki-lod-cpu
            maki-lod-cpu-online-fix
            maki-millenaire-lod-compat
            maki-mods-observer
            maki-ship-anchor-fix
            maki-ship-edge
            maki-ship-footsteps
            maki-ship-save
          )
          for project in "${projects[@]}"; do
            echo "::group::$project"
            gradle -p "custom-mods/$project" clean check jar --stacktrace
            echo "::endgroup::"
          done
