name: Rebuild audited cache 1.4.4 final
on:
  push:
    branches: [compat/chunksmith-4.8.1-millenaire-9.1.0]
    paths: [.github/workflows/publish-audited-cache-final-once.yml]
permissions:
  contents: write
jobs:
  build-final-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run all cache regression tests and compile distributable
        run: gradle --build-cache -p custom-mods/maki-chunksmith-chunk-cache check jar
      - name: Update versioned distribution JAR
        shell: bash
        run: |
          set -euo pipefail
          jar=custom-mods/maki-chunksmith-chunk-cache/build/libs/maki-chunksmith-chunk-cache-1.4.4.jar
          test -s "$jar"
          unzip -p "$jar" META-INF/neoforge.mods.toml | grep -F 'version="1.4.4"'
          cp "$jar" mods/maki-chunksmith-chunk-cache-1.4.4.jar
          test "$(find mods -maxdepth 1 -name 'maki-chunksmith-chunk-cache-*.jar' | wc -l)" -eq 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mods/maki-chunksmith-chunk-cache-1.4.4.jar
          git diff --cached --quiet && exit 0
          git commit -m "build(cache): include asynchronous cache migration load race fix in 1.4.4 JAR"
          git push origin HEAD:compat/chunksmith-4.8.1-millenaire-9.1.0

# Rerun after updating source-level regression's asynchronous rotation boundary.
