name: Issue 83 temporary deployment build

on:
  push:
    branches:
      - refactor/issue-83-unified-pregen

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip issue83 build]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build and test affected custom MOD
        run: |
          gradle --build-cache -p custom-mods/maki-chunksmith-chunk-cache check jar
      - name: Publish deployment JAR
        run: |
          cp custom-mods/maki-chunksmith-chunk-cache/build/libs/maki-chunksmith-chunk-cache-1.4.0.jar mods/maki-chunksmith-chunk-cache-1.4.0.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/maki-chunksmith-chunk-cache-1.4.0.jar
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh issue 83 deployment jar [skip issue83 build]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
