name: issue62 package custom MODs

on:
  push:
    branches: [fix/issue-62]

permissions:
  contents: write

jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-62
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build every maintained custom MOD
        shell: bash
        run: |
          set -euxo pipefail
          projects=(
            maki-airship-compat
            maki-airship-foundation-compat
            maki-assembly-tracking
            maki-diorama-share
            maki-idle-pregen
            maki-lod-cpu
            maki-lod-cpu-online-fix
            maki-millenaire-lod-compat
            maki-mods-observer
            maki-ship-anchor-fix
            maki-ship-edge
            maki-ship-footsteps
            maki-ship-save
            maki-chunksmith-chunk-cache
          )
          for project in "${projects[@]}"; do
            echo "::group::$project"
            gradle -p "custom-mods/$project" clean check jar
            echo "::endgroup::"
          done
      - name: Replace deployable custom MOD set
        shell: bash
        run: |
          set -euxo pipefail
          rm -f mods/maki-*.jar
          for project in custom-mods/maki-*; do
            cp "$project"/build/libs/maki-*.jar mods/
          done
          python3 .github/scripts/check_deployment_sources.py
      - name: Audit rebuilt Mixin annotations
        run: |
          curl --fail --location --retry 3 -o /tmp/sponge-mixin.jar 'https://maven.neoforged.net/releases/net/fabricmc/sponge-mixin/0.16.4+mixin.0.8.7/sponge-mixin-0.16.4+mixin.0.8.7.jar'
          python3 .github/scripts/audit_mixin_annotations.py --annotation-api /tmp/sponge-mixin.jar --github-actions --json-output /tmp/issue62-shipped-mixin-audit.json
      - name: Commit rebuilt deployables and retire one-shot workflow
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/issue62-package.yml
          git add -A mods .github/workflows/issue62-package.yml
          git diff --cached --exit-code && { echo 'Expected rebuilt MOD changes were absent'; exit 1; } || true
          git commit -m 'build: rebuild all custom MOD deployables for issue 62'
          git push origin HEAD:fix/issue-62
