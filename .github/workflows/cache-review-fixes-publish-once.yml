name: Publish cache review-fix binary
on:
  push:
    branches: [compat/chunksmith-4.8.1-millenaire-9.1.0]
    paths: [.github/workflows/cache-review-fixes-publish-once.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Full cache regression tests and compiled JAR
        run: gradle --build-cache -p custom-mods/maki-chunksmith-chunk-cache check jar
      - name: Commit checked binary
        shell: bash
        run: |
          set -euo pipefail
          jar=custom-mods/maki-chunksmith-chunk-cache/build/libs/maki-chunksmith-chunk-cache-1.4.5.jar
          test -s "$jar"
          unzip -p "$jar" META-INF/neoforge.mods.toml | grep -F 'version="1.4.5"'
          cp "$jar" mods/maki-chunksmith-chunk-cache-1.4.5.jar
          test "$(find mods -maxdepth 1 -name 'maki-chunksmith-chunk-cache-*.jar' | wc -l)" -eq 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mods/maki-chunksmith-chunk-cache-1.4.5.jar
          git diff --cached --quiet && exit 0
          git commit -m "build(cache): ship reviewed migration safety fixes in 1.4.5"
          git push origin HEAD:compat/chunksmith-4.8.1-millenaire-9.1.0
