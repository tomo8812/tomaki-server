name: issue62 restore millenaire maintained sources

on:
  push:
    branches: [fix/issue-62]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-62
          fetch-depth: 0
      - name: Restore embedded source-owned Millenaire compatibility classes
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          jar = Path('mods/maki-millenaire-lod-compat-1.0.5.jar')
          wanted = [
              'maki/millenairelod/DeferredData.java',
              'maki/millenairelod/MillenaireLodCompat.java',
              'maki/millenairelod/ReplayController.java',
              'maki/millenairelod/mixin/BuildingInstanceMixin.java',
              'maki/millenairelod/mixin/HorizonGuardMixin.java',
              'maki/millenairelod/mixin/LoneCandidateAccessor.java',
              'maki/millenairelod/mixin/MillenaireMixin.java',
              'maki/millenairelod/mixin/SpawnQueueMixin.java',
              'maki/millenairelod/mixin/VillageManagerMixin.java',
              'maki/millenairelod/mixin/VillageMixin.java',
              'maki/millenairelod/mixin/VillageSpawnerMixin.java',
          ]
          root = Path('custom-mods/maki-millenaire-lod-compat/src/main/java')
          with zipfile.ZipFile(jar) as archive:
              for rel in wanted:
                  entry = 'META-INF/sources/' + rel
                  target = root / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(entry))
                  print(entry, '->', target)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom-mods/maki-millenaire-lod-compat/src/main/java
          git diff --cached --exit-code && { echo 'Expected source restoration changes were absent'; exit 1; } || true
          git commit -m 'build: restore full Millenaire compatibility sources'
          git push origin HEAD:fix/issue-62
