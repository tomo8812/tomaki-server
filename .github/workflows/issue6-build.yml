name: issue-6-build

on:
  push:
    branches:
      - fix/issue-6

permissions:
  contents: write

jobs:
  split-airship-compat:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-6
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build split compatibility jars
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .issue6-build
          mkdir -p .issue6-build/src/net/neoforged/fml/common
          mkdir -p .issue6-build/src/maki/airship/foundation
          mkdir -p .issue6-build/classes

          cat > .issue6-build/src/net/neoforged/fml/common/Mod.java <<'JAVA'
          package net.neoforged.fml.common;

          import java.lang.annotation.ElementType;
          import java.lang.annotation.Retention;
          import java.lang.annotation.RetentionPolicy;
          import java.lang.annotation.Target;

          @Retention(RetentionPolicy.RUNTIME)
          @Target(ElementType.TYPE)
          public @interface Mod {
              String value();
          }
          JAVA

          cat > .issue6-build/src/maki/airship/foundation/FoundationCompat.java <<'JAVA'
          package maki.airship.foundation;

          import net.neoforged.fml.common.Mod;

          @Mod("maki_airship_foundation_compat")
          public final class FoundationCompat {
          }
          JAVA

          javac --release 21 -d .issue6-build/classes \
            .issue6-build/src/net/neoforged/fml/common/Mod.java \
            .issue6-build/src/maki/airship/foundation/FoundationCompat.java

          python3 <<'PY'
          import json
          import pathlib
          import zipfile

          src = pathlib.Path("mods/maki-airship-compat-1.0.12.jar")
          out = pathlib.Path(".issue6-build")
          core = out / "maki-airship-compat-1.0.13.jar"
          adapter = out / "maki-airship-foundation-compat-1.0.0.jar"

          metadata = "META-INF/neoforge.mods.toml"
          core_mixins_path = "maki-airship-compat.mixins.json"
          adapter_mixins_path = "maki-airship-foundation-compat.mixins.json"

          adapter_class_prefixes = (
              "maki/airship/SeatCompat",
              "maki/airship/ShipFurnitureSeats",
          )
          adapter_exact_classes = {
              "maki/airship/FurnitureCoordinates.class",
              "maki/airship/mixin/FoundationSeatUtilMixin.class",
              "maki/airship/mixin/FoundationChairMixin.class",
              "maki/airship/mixin/FurnitureVehicleMixin.class",
          }

          def is_adapter_class(name: str) -> bool:
              return name in adapter_exact_classes or any(name.startswith(p) and name.endswith(".class") for p in adapter_class_prefixes)

          core_metadata = """modLoader="javafml"
          loaderVersion="[4,)"
          license="All Rights Reserved"
          [[mods]]
          modId="maki_airship_compat"
          version="1.0.13"
          displayName="Maki Airship Compatibility"
          description="Generic Valkyrien Skies sleeping, wake-up, passenger, camera, render, light and ship lifecycle compatibility."
          [[mixins]]
          config="maki-airship-compat.mixins.json"
          [[dependencies.maki_airship_compat]]
          modId="neoforge"
          type="required"
          versionRange="[21.1,)"
          ordering="NONE"
          side="BOTH"
          [[dependencies.maki_airship_compat]]
          modId="minecraft"
          type="required"
          versionRange="[1.21.1,1.21.2)"
          ordering="NONE"
          side="BOTH"
          [[dependencies.maki_airship_compat]]
          modId="valkyrienskies"
          type="required"
          versionRange="[2.4.12-td.9_66a13242ed]"
          ordering="AFTER"
          side="BOTH"
          """

          adapter_metadata = """modLoader="javafml"
          loaderVersion="[4,)"
          license="All Rights Reserved"
          [[mods]]
          modId="maki_airship_foundation_compat"
          version="1.0.0"
          displayName="Maki Airship Foundation Compatibility"
          description="Foundation seat adapter for Maki Airship Compatibility."
          [[mixins]]
          config="maki-airship-foundation-compat.mixins.json"
          [[dependencies.maki_airship_foundation_compat]]
          modId="neoforge"
          type="required"
          versionRange="[21.1,)"
          ordering="NONE"
          side="BOTH"
          [[dependencies.maki_airship_foundation_compat]]
          modId="minecraft"
          type="required"
          versionRange="[1.21.1,1.21.2)"
          ordering="NONE"
          side="BOTH"
          [[dependencies.maki_airship_foundation_compat]]
          modId="valkyrienskies"
          type="required"
          versionRange="[2.4.12-td.9_66a13242ed]"
          ordering="AFTER"
          side="BOTH"
          [[dependencies.maki_airship_foundation_compat]]
          modId="maki_airship_compat"
          type="required"
          versionRange="[1.0.13,)"
          ordering="AFTER"
          side="BOTH"
          [[dependencies.maki_airship_foundation_compat]]
          modId="foundation"
          type="required"
          versionRange="[1.0.6,)"
          ordering="AFTER"
          side="BOTH"
          """

          core_mixins = {
              "required": True,
              "minVersion": "0.8",
              "package": "maki.airship.mixin",
              "compatibilityLevel": "JAVA_21",
              "mixins": [
                  "LivingSleepMixin",
                  "SleepDragMixin",
              ],
              "client": [
                  "ClientPassengerMixin",
                  "ClientTickMixin",
                  "ClientRenderMixin",
                  "MountedCameraMixin",
                  "SleepingRenderMixin",
                  "EntityLightMixin",
                  "ShipShiftMixin",
                  "ShipZoomResetMixin",
              ],
              "injectors": {"defaultRequire": 1},
          }

          adapter_mixins = {
              "required": True,
              "minVersion": "0.8",
              "package": "maki.airship.mixin",
              "compatibilityLevel": "JAVA_21",
              "mixins": [
                  "FoundationSeatUtilMixin",
                  "FoundationChairMixin",
                  "FurnitureVehicleMixin",
              ],
              "injectors": {"defaultRequire": 1},
          }

          with zipfile.ZipFile(src, "r") as zin:
              with zipfile.ZipFile(core, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zout:
                  for info in zin.infolist():
                      name = info.filename
                      if name in {metadata, core_mixins_path}:
                          continue
                      if is_adapter_class(name):
                          continue
                      if name.startswith("data/foundation/"):
                          continue
                      zout.writestr(info, zin.read(name))
                  zout.writestr(metadata, core_metadata.encode())
                  zout.writestr(core_mixins_path, (json.dumps(core_mixins, indent=2) + "\n").encode())

              with zipfile.ZipFile(adapter, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zout:
                  zout.writestr("META-INF/MANIFEST.MF", b"Manifest-Version: 1.0\n\n")
                  for info in zin.infolist():
                      name = info.filename
                      if is_adapter_class(name) or name.startswith("data/foundation/"):
                          zout.writestr(info, zin.read(name))
                  foundation_class = pathlib.Path(".issue6-build/classes/maki/airship/foundation/FoundationCompat.class").read_bytes()
                  zout.writestr("maki/airship/foundation/FoundationCompat.class", foundation_class)
                  zout.writestr(metadata, adapter_metadata.encode())
                  zout.writestr(adapter_mixins_path, (json.dumps(adapter_mixins, indent=2) + "\n").encode())

          with zipfile.ZipFile(core, "r") as z:
              names = set(z.namelist())
              assert metadata in names
              assert core_mixins_path in names
              assert not any(is_adapter_class(n) for n in names)
              assert not any(n.startswith("data/foundation/") for n in names)
              assert b'modId="foundation"' not in z.read(metadata)
              assert b"FoundationSeatUtilMixin" not in z.read(core_mixins_path)
              assert b"FoundationChairMixin" not in z.read(core_mixins_path)
              assert b"FurnitureVehicleMixin" not in z.read(core_mixins_path)
              for n in names:
                  if n.endswith(".class"):
                      assert b"net/satisfy/foundation" not in z.read(n), f"Foundation reference leaked into core: {n}"

          with zipfile.ZipFile(adapter, "r") as z:
              names = set(z.namelist())
              required = {
                  "maki/airship/FurnitureCoordinates.class",
                  "maki/airship/SeatCompat.class",
                  "maki/airship/ShipFurnitureSeats.class",
                  "maki/airship/mixin/FoundationSeatUtilMixin.class",
                  "maki/airship/mixin/FoundationChairMixin.class",
                  "maki/airship/mixin/FurnitureVehicleMixin.class",
                  "maki/airship/foundation/FoundationCompat.class",
                  "data/foundation/vs_entities/chair.json",
                  metadata,
                  adapter_mixins_path,
              }
              missing = required - names
              assert not missing, f"adapter missing entries: {sorted(missing)}"
              assert b'modId="foundation"' in z.read(metadata)
              assert b'modId="maki_airship_compat"' in z.read(metadata)
              entrypoint = z.read("maki/airship/foundation/FoundationCompat.class")
              assert b"maki_airship_foundation_compat" in entrypoint
              assert b"net/neoforged/fml/common/Mod" in entrypoint

          print("core_size", core.stat().st_size)
          print("adapter_size", adapter.stat().st_size)
          print("structural_verification=PASS")
          PY

          jar tf .issue6-build/maki-airship-compat-1.0.13.jar | grep -E 'Foundation|SeatCompat|ShipFurnitureSeats|data/foundation' && exit 1 || true
          jar tf .issue6-build/maki-airship-foundation-compat-1.0.0.jar | grep -E 'FoundationSeatUtilMixin|FoundationChairMixin|FurnitureVehicleMixin|data/foundation/vs_entities/chair.json' >/dev/null

      - name: Commit split jars to issue branch
        shell: bash
        run: |
          set -euo pipefail
          rm mods/maki-airship-compat-1.0.12.jar
          cp .issue6-build/maki-airship-compat-1.0.13.jar mods/
          cp .issue6-build/maki-airship-foundation-compat-1.0.0.jar mods/
          rm .github/workflows/issue6-build.yml
          rm -rf .issue6-build

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: isolate Foundation airship compatibility"
          git push origin HEAD:fix/issue-6
