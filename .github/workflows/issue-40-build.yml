name: Issue 40 build package

on:
  push:
    branches: [fix/issue-40]
    paths:
      - 'custom-mods/maki-chunksmith-chunk-cache/**'
      - 'config/maki-chunksmith-chunk-cache.properties'
      - '.github/workflows/issue-40-build.yml'

permissions:
  contents: write

jobs:
  build-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-40
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build and check
        run: gradle -p custom-mods/maki-chunksmith-chunk-cache clean check jar --stacktrace --no-daemon
      - name: Verify package
        run: |
          JAR=custom-mods/maki-chunksmith-chunk-cache/build/libs/maki-chunksmith-chunk-cache-1.1.0.jar
          test -f "$JAR"
          unzip -t "$JAR"
          test "$(javap -verbose -classpath "$JAR" maki.chunksmithcache.CacheManager | awk '/major version/ {print $3; exit}')" = "65"
          test "$(jar tf "$JAR" | grep -Ec '^(net|org|com/kishku7|it/unimi)/')" = "0"
      - name: Publish built JAR to branch
        run: |
          cp custom-mods/maki-chunksmith-chunk-cache/build/libs/maki-chunksmith-chunk-cache-1.1.0.jar mods/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/maki-chunksmith-chunk-cache-1.1.0.jar
          git diff --cached --quiet && exit 0
          git commit -m "build: refresh maki-chunksmith-chunk-cache 1.1.0"
          git push origin HEAD:fix/issue-40
