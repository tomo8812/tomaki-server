name: Issue 36 temporary lag observer artifact

on:
  push:
    branches: [fix/issue-36]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build and check lag observer
        run: gradle -p custom-mods/maki-lag-observer clean check jar

      - name: Replace shipped lag observer JAR
        if: github.actor != 'github-actions[bot]'
        run: |
          rm -f mods/maki-lag-observer-1.0.0.jar
          cp custom-mods/maki-lag-observer/build/libs/maki-lag-observer-1.1.0.jar mods/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/maki-lag-observer-1.0.0.jar mods/maki-lag-observer-1.1.0.jar
          git commit -m "build: ship maki-lag-observer 1.1.0"
          git push

      - name: Upload lag observer JAR
        uses: actions/upload-artifact@v4
        with:
          name: maki-lag-observer-1.1.0
          path: custom-mods/maki-lag-observer/build/libs/maki-lag-observer-1.1.0.jar
          if-no-files-found: error
          retention-days: 1
