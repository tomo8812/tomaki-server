name: Issue 36 temporary lag observer artifact

on:
  push:
    branches: [fix/issue-36]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build and check lag observer
        run: gradle -p custom-mods/maki-lag-observer clean check jar

      - name: Upload lag observer JAR
        uses: actions/upload-artifact@v4
        with:
          name: maki-lag-observer-1.1.0
          path: custom-mods/maki-lag-observer/build/libs/maki-lag-observer-1.1.0.jar
          if-no-files-found: error
          retention-days: 1
