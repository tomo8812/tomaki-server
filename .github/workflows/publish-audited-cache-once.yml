name: Publish audited cache 1.4.4 once
on:
  push:
    branches: [compat/chunksmith-4.8.1-millenaire-9.1.0]
    paths: [.github/workflows/publish-audited-cache-once.yml]
permissions:
  contents: write
jobs:
  build-audited-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile, run complete tests, and build 1.4.4
        run: gradle --build-cache -p custom-mods/maki-chunksmith-chunk-cache check jar
      - name: Replace the deployed JAR with the verified binary
        shell: bash
        run: |
          set -euo pipefail
          jar=custom-mods/maki-chunksmith-chunk-cache/build/libs/maki-chunksmith-chunk-cache-1.4.4.jar
          test -s "$jar"
          unzip -p "$jar" META-INF/neoforge.mods.toml | grep -F 'version="1.4.4"'
          rm mods/maki-chunksmith-chunk-cache-1.4.3.jar
          cp "$jar" mods/maki-chunksmith-chunk-cache-1.4.4.jar
          test "$(find mods -maxdepth 1 -name 'maki-chunksmith-chunk-cache-*.jar' | wc -l)" -eq 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mods/maki-chunksmith-chunk-cache-1.3.3.jar mods/maki-chunksmith-chunk-cache-1.4.4.jar 2>/dev/null || git add -A mods/maki-chunksmith-chunk-cache-*.jar
          git add -A mods
          git commit -m "build(cache): ship audited FULL cache migration 1.4.4"
          git push origin HEAD:compat/chunksmith-4.8.1-millenaire-9.1.0
