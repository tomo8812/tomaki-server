name: Custom MOD unused-code inventory

on:
  pull_request:
    paths:
      - 'custom-mods/**'
      - '.github/scripts/audit_unused_java.py'
      - '.github/workflows/audit-unused-java.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            custom-mods
      - name: Inventory unreachable Java candidates across all custom MODs
        run: python3 .github/scripts/audit_unused_java.py --json-output reports/unused-java.json
      - name: Upload source inventory
        uses: actions/upload-artifact@v4
        with:
          name: unused-java-candidates
          path: reports/unused-java.json
          retention-days: 14
