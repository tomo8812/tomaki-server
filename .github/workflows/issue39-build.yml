name: Issue 39 build

on:
  push:
    branches:
      - fix/issue-39

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip issue39-build]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-39
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Build and test maki-lod-cpu
        run: gradle -p custom-mods/maki-lod-cpu clean test build --stacktrace
      - name: Install packaged mod into server mods
        run: |
          rm -f mods/maki-lod-cpu-1.3.2.jar
          cp custom-mods/maki-lod-cpu/build/libs/maki-lod-cpu-1.3.3.jar mods/maki-lod-cpu-1.3.3.jar
          jar tf mods/maki-lod-cpu-1.3.3.jar | grep -E 'maki/lodcpu/(ExternalTaskMigration|TaskMigrationStore|PlayerCenter|mixin/TaskLoaderAccessor)\.class'
          unzip -p mods/maki-lod-cpu-1.3.3.jar META-INF/neoforge.mods.toml | grep 'version="1.3.3"'
      - name: Verify dependent online-fix still compiles
        run: gradle -p custom-mods/maki-lod-cpu-online-fix clean check --stacktrace
      - name: Publish packaged mod to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mods/maki-lod-cpu-1.3.2.jar mods/maki-lod-cpu-1.3.3.jar
          if git diff --cached --quiet; then
            echo "Packaged JAR already matches"
          else
            git commit -m "build: package maki-lod-cpu 1.3.3 [skip issue39-build]"
            git push origin HEAD:fix/issue-39
          fi
