name: Inspect Millenaire 9.1 queue bytecode for PR 90
on:
  push:
    branches: [compat/chunksmith-4.8.1-millenaire-9.1.0]
    paths: [.github/workflows/inspect-village-queue-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect actual methods and queue lifecycle
        run: |
          python3 - <<'PY'
          import subprocess
          jar='mods/millenaire-9.1.0.jar'
          classes=['org.millenaire.world.VillageSpawnQueue','org.millenaire.world.sitescore.SiteSurvey','org.millenaire.world.SiteHunter']
          targets={'VillageSpawnQueue':['trySpawnNext(', 'processLBQueue(', 'isExpired(', 'trySpawnVillage(', 'getStats('],
                   'SiteSurvey':['processQueue(', 'ENABLED'],
                   'SiteHunter':['addCandidate(', 'attempt(', 'tick(', 'work', 'ENABLED']}
          for cls in classes:
              print('========== '+cls+' ==========',flush=True)
              name=cls.rsplit('.',1)[-1]
              desc=subprocess.run(['javap','-p','-classpath',jar,cls],text=True,capture_output=True,check=True).stdout.splitlines()
              for line in desc:
                  if any(t in line for t in targets[name]): print('SIG '+line,flush=True)
              lines=subprocess.run(['javap','-p','-c','-classpath',jar,cls],text=True,capture_output=True,check=True).stdout.splitlines()
              headers=[i for i,s in enumerate(lines) if s.startswith('  ') and not s.startswith('    ') and '(' in s and (s.strip().endswith(';') or s.strip().endswith(')'))]
              headers.append(len(lines))
              for i,begin in enumerate(headers[:-1]):
                  if any(t in lines[begin] for t in targets[name]) and '(' in lines[begin]:
                      end=headers[i+1]
                      chunk=lines[begin:min(end,begin+240)]
                      print('METHOD '+lines[begin],flush=True)
                      for line in chunk: print(line,flush=True)
          PY
