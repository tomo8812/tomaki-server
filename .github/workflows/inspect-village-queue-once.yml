name: Verify and publish Millenaire 9.1 review fixes
on:
  push:
    branches: [compat/chunksmith-4.8.1-millenaire-9.1.0]
    paths: [.github/workflows/inspect-village-queue-once.yml]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify pinned native queue and ABI contracts
        run: |
          python3 .github/scripts/verify_upstream_481_910.py \
            --chunksmith 'mods/chunksmith-4.8.1+1.21.1-neoforge.jar' \
            --millenaire 'mods/millenaire-9.1.0.jar'
      - name: Compile and test Millenaire compatibility
        run: |
          gradle --no-daemon --build-cache -p custom-mods/maki-millenaire-lod-compat check jar
          install -m 0644 \
            custom-mods/maki-millenaire-lod-compat/build/libs/maki-millenaire-lod-compat-1.0.8.jar \
            mods/maki-millenaire-lod-compat-1.0.8.jar
      - name: Audit mod interoperability and deployed sources
        run: |
          python3 .github/scripts/check_mod_interop.py --mods-dir mods
          python3 .github/scripts/check_deployment_sources.py
      - name: Commit tested compatibility JAR to existing PR branch
        run: |
          set -euo pipefail
          git add mods/maki-millenaire-lod-compat-1.0.8.jar
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(millenaire): publish review-corrected compatibility JAR'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
