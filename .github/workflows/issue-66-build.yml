name: Issue 66 deployment build
# revision: 3

on:
  push:
    branches: [fix/issue-66]

permissions:
  contents: write

jobs:
  build-and-refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-66
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build resource governor
        run: gradle -p custom-mods/maki-lod-cpu clean check jar

      - name: Refresh resource governor deployment JAR
        run: |
          find mods -maxdepth 1 -type f -name 'maki-lod-cpu-[0-9]*.jar' -delete
          cp custom-mods/maki-lod-cpu/build/libs/maki-lod-cpu-1.4.0.jar mods/

      - name: Build chunk cache
        run: gradle -p custom-mods/maki-chunksmith-chunk-cache clean check jar

      - name: Refresh chunk-cache deployment JAR
        run: |
          rm -f mods/maki-chunksmith-chunk-cache-*.jar
          cp custom-mods/maki-chunksmith-chunk-cache/build/libs/maki-chunksmith-chunk-cache-1.2.0.jar mods/

      - name: Verify source-owned deployment set
        run: python3 .github/scripts/check_deployment_sources.py

      - name: Commit rebuilt deployment JARs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mods/maki-lod-cpu-*.jar mods/maki-chunksmith-chunk-cache-*.jar
          if git diff --cached --quiet; then
            echo "No deployment JAR changes"
          else
            git commit -m "build: refresh issue 66 deployment jars"
            git push origin HEAD:fix/issue-66
          fi
