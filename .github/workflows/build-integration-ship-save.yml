name: Build integrated maki-ship-save

on:
  push:
    branches: [integration/ship-save-issues-4-12]
    paths:
      - 'custom-mods/maki-ship-save/**'
      - '.github/workflows/build-integration-ship-save.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build integrated mod
        run: gradle -p custom-mods/maki-ship-save clean build --stacktrace
      - name: Validate and publish jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="custom-mods/maki-ship-save/build/libs/maki-ship-save-1.0.2.jar"
          test -f "$JAR"
          unzip -t "$JAR"
          javap -classpath "$JAR" -verbose maki.shipsave.SaveProtection | grep -q "major version: 65"
          rm -f mods/maki-ship-save-1.0.0.jar mods/maki-ship-save-1.0.1.jar
          cp "$JAR" mods/maki-ship-save-1.0.2.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/maki-ship-save-1.0.0.jar mods/maki-ship-save-1.0.1.jar mods/maki-ship-save-1.0.2.jar
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: publish integrated maki-ship-save 1.0.2"
          git push
