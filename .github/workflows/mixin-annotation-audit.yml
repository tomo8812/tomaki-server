name: Mixin static checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build and check maki-diorama-share
        run: gradle -p custom-mods/maki-diorama-share clean check jar

      - name: Build and check maki-chunksmith-chunk-cache
        run: gradle -p custom-mods/maki-chunksmith-chunk-cache clean check jar

      - name: Build and check maki-ship-anchor-fix
        run: gradle -p custom-mods/maki-ship-anchor-fix clean check jar

      - name: Build and check maki-lod-cpu-online-fix
        run: gradle -p custom-mods/maki-lod-cpu-online-fix clean check jar

      - name: Build and check maki-lag-observer
        run: gradle -p custom-mods/maki-lag-observer clean check jar

      - name: Upload maki-diorama-share JAR
        uses: actions/upload-artifact@v4
        with:
          name: maki-diorama-share-jar
          path: custom-mods/maki-diorama-share/build/libs/maki-diorama-share-1.0.1.jar
          retention-days: 14

      - name: Stage verified issue 48 JAR
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/issue-48' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          cp custom-mods/maki-diorama-share/build/libs/maki-diorama-share-1.0.1.jar /tmp/maki-diorama-share-1.0.1.jar
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          rm -f mods/maki-diorama-share-1.0.0.jar
          cp /tmp/maki-diorama-share-1.0.1.jar mods/maki-diorama-share-1.0.1.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/maki-diorama-share-1.0.0.jar mods/maki-diorama-share-1.0.1.jar
          if ! git diff --cached --quiet; then
            git commit -m "build: ship maki-diorama-share 1.0.1"
            git push origin "HEAD:$HEAD_BRANCH"
          fi

      - name: Audit rebuilt JARs
        run: |
          curl --fail --location --retry 3 -o /tmp/sponge-mixin.jar 'https://maven.neoforged.net/releases/net/fabricmc/sponge-mixin/0.16.4+mixin.0.8.7/sponge-mixin-0.16.4+mixin.0.8.7.jar'
          mkdir -p /tmp/maki-rebuilt
          cp custom-mods/*/build/libs/maki-*.jar /tmp/maki-rebuilt/
          python3 .github/scripts/audit_mixin_annotations.py --mods-dir /tmp/maki-rebuilt --annotation-api /tmp/sponge-mixin.jar --github-actions --json-output reports/rebuilt-mixin-audit.json

      - name: Upload rebuilt JAR audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-mixin-audit
          path: reports/rebuilt-mixin-audit.json
          retention-days: 14

  jar-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Audit registered Mixin annotation ABI
        run: |
          curl --fail --location --retry 3 -o /tmp/sponge-mixin.jar 'https://maven.neoforged.net/releases/net/fabricmc/sponge-mixin/0.16.4+mixin.0.8.7/sponge-mixin-0.16.4+mixin.0.8.7.jar'
          python3 .github/scripts/audit_mixin_annotations.py --annotation-api /tmp/sponge-mixin.jar --github-actions --json-output reports/shipped-mixin-audit.json

      - name: Test audit regressions
        if: always()
        run: python3 -m unittest discover -s .github/scripts -p 'test_mixin*.py'

      - name: Upload shipped JAR audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipped-mixin-audit
          path: reports/shipped-mixin-audit.json
          retention-days: 14
