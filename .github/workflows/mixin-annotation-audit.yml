name: Mixin static checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mixin-static-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jar-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      projects: ${{ steps.scope.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            custom-mods

      - name: Select checks from the complete change
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=(--base "$BASE_SHA")
          if [ "$FULL" = true ]; then args+=(--full); fi
          python3 .github/scripts/plan_mixin_ci.py "${args[@]}"

      - name: Fetch deployment JARs only when needed
        if: steps.scope.outputs.audit == 'true' || steps.scope.outputs.tests == 'true'
        run: git sparse-checkout add mods

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.audit == 'true' || steps.scope.outputs.tests == 'true'
        with:
          python-version: '3.12'

      - name: Set up Java for regression fixtures
        if: steps.scope.outputs.tests == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Audit shipped JARs
        if: steps.scope.outputs.audit == 'true'
        run: |
          curl --fail --location --retry 3 -o /tmp/sponge-mixin.jar 'https://maven.neoforged.net/releases/net/fabricmc/sponge-mixin/0.16.4+mixin.0.8.7/sponge-mixin-0.16.4+mixin.0.8.7.jar'
          python3 .github/scripts/audit_mixin_annotations.py --annotation-api /tmp/sponge-mixin.jar --github-actions --json-output reports/shipped-mixin-audit.json

      - name: Verify deployment sources and unique custom MOD IDs
        if: steps.scope.outputs.audit == 'true'
        run: python3 .github/scripts/check_deployment_sources.py

      - name: Test audit and selection regressions
        if: always() && steps.scope.outputs.tests == 'true'
        run: python3 -m unittest discover -s .github/scripts -p 'test_mixin*.py'

      - name: Upload shipped JAR audit
        if: always() && steps.scope.outputs.audit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shipped-mixin-audit
          path: reports/shipped-mixin-audit.json
          retention-days: 14

  source-build:
    needs: jar-audit
    if: needs.jar-audit.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            custom-mods
            mods

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Build selected projects in dependency order
        env:
          PROJECTS: ${{ needs.jar-audit.outputs.projects }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess
          output = pathlib.Path('/tmp/maki-rebuilt')
          output.mkdir()
          for project in json.loads(os.environ['PROJECTS']):
              directory = pathlib.Path('custom-mods') / project
              subprocess.run(['gradle', '--build-cache', '-p', str(directory), 'check', 'jar'], check=True)
              jars = list((directory / 'build/libs').glob('maki-*.jar'))
              jars = [jar for jar in jars if not jar.name.endswith(('-sources.jar', '-javadoc.jar'))]
              if not jars:
                  raise SystemExit(f'No deployment JAR produced by {project}')
              for jar in jars:
                  shutil.copy2(jar, output / jar.name)
          PY

      - name: Audit rebuilt JARs
        run: |
          curl --fail --location --retry 3 -o /tmp/sponge-mixin.jar 'https://maven.neoforged.net/releases/net/fabricmc/sponge-mixin/0.16.4+mixin.0.8.7/sponge-mixin-0.16.4+mixin.0.8.7.jar'
          python3 .github/scripts/audit_mixin_annotations.py --mods-dir /tmp/maki-rebuilt --annotation-api /tmp/sponge-mixin.jar --github-actions --json-output reports/rebuilt-mixin-audit.json

      - name: Upload rebuilt custom MOD JARs for issue 62
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/issue-62'
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-custom-mod-jars
          path: /tmp/maki-rebuilt/*.jar
          if-no-files-found: error
          retention-days: 2

      - name: Upload rebuilt JAR audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-mixin-audit
          path: reports/rebuilt-mixin-audit.json
          retention-days: 14

  publish-issue62-footsteps:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/issue-62' && github.event.pull_request.head.repo.full_name == github.repository
    needs: source-build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download rebuilt custom MOD JARs
        uses: actions/download-artifact@v4
        with:
          name: rebuilt-custom-mod-jars
          path: /tmp/maki-rebuilt
      - name: Publish corrected footsteps JAR
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euxo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD" ]] || {
            echo "Branch advanced; refusing stale artifact publication."
            exit 0
          }
          target=mods/maki-ship-footsteps-1.0.1.jar
          rebuilt=/tmp/maki-rebuilt/maki-ship-footsteps-1.0.1.jar
          test -f "$rebuilt"
          jar tf "$rebuilt" >/dev/null
          if javap -classpath "$target" -p -c maki.shipsteps.mixin.ShipStepMixin               | grep -q 'getShipManagingPos:(Lnet/minecraft/world/level/Level;Lnet/minecraft/core/BlockPos;)'; then
            echo "Checked-in footsteps JAR already has the BlockPos callsite."
            exit 0
          fi
          cp "$rebuilt" "$target"
          javap -classpath "$target" -p -c maki.shipsteps.mixin.ShipStepMixin             | grep -q 'getShipManagingPos:(Lnet/minecraft/world/level/Level;Lnet/minecraft/core/BlockPos;)'
          ! javap -classpath "$target" -p -c maki.shipsteps.mixin.ShipStepMixin             | grep -q 'getShipManagingPos:(Lnet/minecraft/world/level/Level;Lnet/minecraft/core/Vec3i;)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'build: rebuild ship footsteps for BlockPos ABI'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
