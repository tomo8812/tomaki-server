name: Audit Mixin annotation ABI

on:
  push:
    paths:
      - 'mods/maki-*.jar'
      - 'custom-mods/maki-chunksmith-chunk-cache/**'
      - 'custom-mods/maki-ship-anchor-fix/**'
      - '.github/scripts/audit_mixin_annotations.py'
      - '.github/workflows/mixin-annotation-audit.yml'
  pull_request:
    paths:
      - 'mods/maki-*.jar'
      - 'custom-mods/maki-chunksmith-chunk-cache/**'
      - 'custom-mods/maki-ship-anchor-fix/**'
      - '.github/scripts/audit_mixin_annotations.py'
      - '.github/workflows/mixin-annotation-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build and check maki-chunksmith-chunk-cache
        run: gradle -p custom-mods/maki-chunksmith-chunk-cache clean check jar

      - name: Build and check maki-ship-anchor-fix
        run: gradle -p custom-mods/maki-ship-anchor-fix clean check jar

  jar-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Audit registered Mixin annotation ABI
        run: python3 .github/scripts/audit_mixin_annotations.py
