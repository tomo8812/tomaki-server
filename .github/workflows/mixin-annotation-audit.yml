name: Mixin static checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build and check maki-status-io
        run: gradle -p custom-mods/maki-status-io clean check jar

      - name: Build and check maki-chunksmith-chunk-cache
        run: gradle -p custom-mods/maki-chunksmith-chunk-cache clean check jar

      - name: Build and check maki-lod-cpu
        run: gradle -p custom-mods/maki-lod-cpu clean check jar

      - name: Build and check maki-ship-anchor-fix
        run: gradle -p custom-mods/maki-ship-anchor-fix clean check jar

      - name: Build and check maki-lod-cpu-online-fix
        run: gradle -p custom-mods/maki-lod-cpu-online-fix clean check jar

      - name: Build and check maki-lag-observer
        run: gradle -p custom-mods/maki-lag-observer clean check jar

      - name: Audit rebuilt JARs
        run: |
          curl --fail --location --retry 3 -o /tmp/sponge-mixin.jar 'https://maven.neoforged.net/releases/net/fabricmc/sponge-mixin/0.16.4+mixin.0.8.7/sponge-mixin-0.16.4+mixin.0.8.7.jar'
          mkdir -p /tmp/maki-rebuilt
          cp custom-mods/*/build/libs/maki-*.jar /tmp/maki-rebuilt/
          python3 .github/scripts/audit_mixin_annotations.py --mods-dir /tmp/maki-rebuilt --annotation-api /tmp/sponge-mixin.jar --github-actions --json-output reports/rebuilt-mixin-audit.json

      - name: Upload rebuilt custom MOD JARs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-custom-mod-jars
          path: /tmp/maki-rebuilt/*.jar
          retention-days: 2

      - name: Package issue 45 custom MOD JARs
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/issue-45'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue45-jars
          cp custom-mods/maki-status-io/build/libs/maki-status-io-1.0.0.jar /tmp/issue45-jars/
          cp custom-mods/maki-lod-cpu/build/libs/maki-lod-cpu-1.3.3.jar /tmp/issue45-jars/
          cp custom-mods/maki-chunksmith-chunk-cache/build/libs/maki-chunksmith-chunk-cache-1.0.3.jar /tmp/issue45-jars/

          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

          if [[ -f mods/maki-status-io-1.0.0.jar &&
                -f mods/maki-lod-cpu-1.3.3.jar &&
                -f mods/maki-chunksmith-chunk-cache-1.0.3.jar &&
                ! -f mods/maki-lod-cpu-1.3.2.jar &&
                ! -f mods/maki-chunksmith-chunk-cache-1.0.2.jar ]]; then
            echo "Issue 45 JARs already packaged."
            exit 0
          fi

          rm -f mods/maki-lod-cpu-1.3.2.jar mods/maki-chunksmith-chunk-cache-1.0.2.jar
          cp /tmp/issue45-jars/*.jar mods/
          git add -A --             mods/maki-status-io-1.0.0.jar             mods/maki-lod-cpu-1.3.2.jar             mods/maki-lod-cpu-1.3.3.jar             mods/maki-chunksmith-chunk-cache-1.0.2.jar             mods/maki-chunksmith-chunk-cache-1.0.3.jar

          if git diff --cached --quiet; then
            echo "No packaging changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: package issue 45 custom mods"
          git push origin "HEAD:$BRANCH"


      - name: Upload rebuilt JAR audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-mixin-audit
          path: reports/rebuilt-mixin-audit.json
          retention-days: 14

  jar-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Audit registered Mixin annotation ABI
        run: |
          curl --fail --location --retry 3 -o /tmp/sponge-mixin.jar 'https://maven.neoforged.net/releases/net/fabricmc/sponge-mixin/0.16.4+mixin.0.8.7/sponge-mixin-0.16.4+mixin.0.8.7.jar'
          python3 .github/scripts/audit_mixin_annotations.py --annotation-api /tmp/sponge-mixin.jar --github-actions --json-output reports/shipped-mixin-audit.json

      - name: Test audit regressions
        if: always()
        run: python3 -m unittest discover -s .github/scripts -p 'test_mixin*.py'

      - name: Upload shipped JAR audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipped-mixin-audit
          path: reports/shipped-mixin-audit.json
          retention-days: 14
