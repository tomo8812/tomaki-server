name: Mixin static checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build and check every maintained custom MOD
        shell: bash
        run: |
          set -euxo pipefail
          projects=(
            maki-airship-compat
            maki-airship-foundation-compat
            maki-assembly-tracking
            maki-chunksmith-chunk-cache
            maki-diorama-share
            maki-idle-pregen
            maki-lod-cpu
            maki-lod-cpu-online-fix
            maki-millenaire-lod-compat
            maki-mods-observer
            maki-ship-anchor-fix
            maki-ship-edge
            maki-ship-footsteps
            maki-ship-save
          )
          for project in "${projects[@]}"; do
            echo "::group::$project"
            gradle -p "custom-mods/$project" clean check jar
            echo "::endgroup::"
          done
      - name: Audit rebuilt JARs
        run: |
          curl --fail --location --retry 3 -o /tmp/sponge-mixin.jar 'https://maven.neoforged.net/releases/net/fabricmc/sponge-mixin/0.16.4+mixin.0.8.7/sponge-mixin-0.16.4+mixin.0.8.7.jar'
          mkdir -p /tmp/maki-rebuilt
          cp custom-mods/*/build/libs/maki-*.jar /tmp/maki-rebuilt/
          python3 .github/scripts/audit_mixin_annotations.py --mods-dir /tmp/maki-rebuilt --annotation-api /tmp/sponge-mixin.jar --github-actions --json-output reports/rebuilt-mixin-audit.json
      - name: Upload rebuilt custom MOD JARs
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-custom-mod-jars
          path: /tmp/maki-rebuilt/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload rebuilt JAR audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-mixin-audit
          path: reports/rebuilt-mixin-audit.json
          retention-days: 14

  jar-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Audit registered Mixin annotation ABI
        run: |
          curl --fail --location --retry 3 -o /tmp/sponge-mixin.jar 'https://maven.neoforged.net/releases/net/fabricmc/sponge-mixin/0.16.4+mixin.0.8.7/sponge-mixin-0.16.4+mixin.0.8.7.jar'
          python3 .github/scripts/audit_mixin_annotations.py --annotation-api /tmp/sponge-mixin.jar --github-actions --json-output reports/shipped-mixin-audit.json
      - name: Verify deployment sources and unique custom MOD IDs
        run: python3 .github/scripts/check_deployment_sources.py
      - name: Test audit regressions
        if: always()
        run: python3 -m unittest discover -s .github/scripts -p 'test_mixin*.py'
      - name: Upload shipped JAR audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipped-mixin-audit
          path: reports/shipped-mixin-audit.json
          retention-days: 14
