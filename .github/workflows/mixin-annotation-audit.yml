name: Mixin static checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mixin-static-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jar-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      projects: ${{ steps.scope.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            config
            custom-mods

      - name: Select checks from the complete change
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=(--base "$BASE_SHA")
          if [ "$FULL" = true ]; then args+=(--full); fi
          python3 .github/scripts/plan_mixin_ci.py "${args[@]}"

      - name: Fetch deployment JARs only when needed
        if: steps.scope.outputs.audit == 'true' || steps.scope.outputs.tests == 'true'
        run: git sparse-checkout add mods

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.audit == 'true' || steps.scope.outputs.tests == 'true'
        with:
          python-version: '3.12'

      - name: Set up Java for regression fixtures
        if: steps.scope.outputs.tests == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Audit shipped JARs
        if: steps.scope.outputs.audit == 'true'
        run: |
          curl --fail --location --retry 3 -o /tmp/sponge-mixin.jar 'https://maven.neoforged.net/releases/net/fabricmc/sponge-mixin/0.16.4+mixin.0.8.7/sponge-mixin-0.16.4+mixin.0.8.7.jar'
          python3 .github/scripts/audit_mixin_annotations.py --annotation-api /tmp/sponge-mixin.jar --github-actions --json-output reports/shipped-mixin-audit.json

      - name: Check installed MOD dependencies and required Mixin bytecode injections
        if: always() && steps.scope.outputs.audit == 'true'
        run: python3 .github/scripts/check_mod_interop.py --mods-dir mods --github-actions --json-output reports/cross-mod-compat.json

      - name: Upload cross-MOD compatibility report
        if: always() && steps.scope.outputs.audit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cross-mod-bytecode-audit
          path: reports/cross-mod-compat.json
          retention-days: 14

      - name: Verify deployment sources and unique custom MOD IDs
        if: steps.scope.outputs.audit == 'true'
        run: python3 .github/scripts/check_deployment_sources.py

      - name: Test audit and selection regressions
        if: always() && steps.scope.outputs.tests == 'true'
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_mixin*.py'
          python3 -m unittest discover -s .github/scripts -p 'test_mod_interop.py'

      - name: Upload shipped JAR audit
        if: always() && steps.scope.outputs.audit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shipped-mixin-audit
          path: reports/shipped-mixin-audit.json
          retention-days: 14

  source-build:
    needs: jar-audit
    if: always() && needs.jar-audit.outputs.projects != '[]' && needs.jar-audit.outputs.projects != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            custom-mods
            mods

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Build selected projects in dependency order
        env:
          PROJECTS: ${{ needs.jar-audit.outputs.projects }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess
          output = pathlib.Path('/tmp/maki-rebuilt')
          output.mkdir()
          for project in json.loads(os.environ['PROJECTS']):
              directory = pathlib.Path('custom-mods') / project
              subprocess.run(['gradle', '--build-cache', '-p', str(directory), 'check', 'jar'], check=True)
              jars = list((directory / 'build/libs').glob('maki-*.jar'))
              jars = [jar for jar in jars if not jar.name.endswith(('-sources.jar', '-javadoc.jar'))]
              if not jars:
                  raise SystemExit(f'No deployment JAR produced by {project}')
              for jar in jars:
                  shutil.copy2(jar, output / jar.name)
          PY

      - name: Upload rebuilt deployment JARs
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-deployment-jars
          path: /tmp/maki-rebuilt/*.jar
          retention-days: 14

      - name: Audit rebuilt JARs
        run: |
          curl --fail --location --retry 3 -o /tmp/sponge-mixin.jar 'https://maven.neoforged.net/releases/net/fabricmc/sponge-mixin/0.16.4+mixin.0.8.7/sponge-mixin-0.16.4+mixin.0.8.7.jar'
          python3 .github/scripts/audit_mixin_annotations.py --mods-dir /tmp/maki-rebuilt --annotation-api /tmp/sponge-mixin.jar --github-actions --json-output reports/rebuilt-mixin-audit.json


      - name: Publish verified pregen deployment JARs to this PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'design/pregen-throughput-controller-v2-20261110'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          current=$(curl --fail --silent --show-error "${auth[@]}" "$api/git/ref/heads/$HEAD_REF" | jq -r '.object.sha')
          test "$current" = "$EXPECTED_HEAD" || { echo "branch moved: expected $EXPECTED_HEAD, got $current" >&2; exit 1; }
          base_tree=$(curl --fail --silent --show-error "${auth[@]}" "$api/git/commits/$current" | jq -r '.tree.sha')

          make_blob() {
            local jar="$1"
            base64 -w0 "$jar" | jq -Rs '{content:.,encoding:"base64"}' |
              curl --fail --silent --show-error "${auth[@]}" -X POST "$api/git/blobs" --data-binary @- | jq -r '.sha'
          }
          cache_blob=$(make_blob /tmp/maki-rebuilt/maki-chunksmith-chunk-cache-1.4.2.jar)
          cpu_blob=$(make_blob /tmp/maki-rebuilt/maki-lod-cpu-1.4.2.jar)

          tree=$(jq -n --arg base "$base_tree" --arg cache "$cache_blob" --arg cpu "$cpu_blob" '{
            base_tree:$base,
            tree:[
              {path:"mods/maki-chunksmith-chunk-cache-1.4.2.jar",mode:"100644",type:"blob",sha:$cache},
              {path:"mods/maki-lod-cpu-1.4.2.jar",mode:"100644",type:"blob",sha:$cpu}
            ]
          }' | curl --fail --silent --show-error "${auth[@]}" -X POST "$api/git/trees" --data-binary @- | jq -r '.sha')

          commit=$(jq -n --arg message "build(pregen): ship verified controller jars" --arg tree "$tree" --arg parent "$current" '{
            message:$message,tree:$tree,parents:[$parent]
          }' | curl --fail --silent --show-error "${auth[@]}" -X POST "$api/git/commits" --data-binary @- | jq -r '.sha')

          latest=$(curl --fail --silent --show-error "${auth[@]}" "$api/git/ref/heads/$HEAD_REF" | jq -r '.object.sha')
          test "$latest" = "$current" || { echo "branch moved before publish: expected $current, got $latest" >&2; exit 1; }
          jq -n --arg sha "$commit" '{sha:$sha,force:false}' |
            curl --fail --silent --show-error "${auth[@]}" -X PATCH "$api/git/refs/heads/$HEAD_REF" --data-binary @- >/dev/null
          echo "published deployment commit $commit"

      - name: Upload rebuilt JAR audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-mixin-audit
          path: reports/rebuilt-mixin-audit.json
          retention-days: 14

