name: Build maki-lod-cpu issue 5

on:
  push:
    branches: [fix/issue-5]
    paths:
      - '.github/workflows/build-maki-lod-cpu-issue-5.yml'
      - 'custom-mods/maki-lod-cpu/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compile and package
        shell: bash
        run: gradle -p custom-mods/maki-lod-cpu clean build --stacktrace

      - name: Validate packaged mod
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile

          jar = Path("custom-mods/maki-lod-cpu/build/libs/maki-lod-cpu-1.3.0.jar")
          assert jar.is_file(), jar
          with ZipFile(jar) as zf:
              names = set(zf.namelist())
              required = {
                  "maki/lodcpu/PlayerCenter.class",
                  "maki/lodcpu/TaskOwnership.class",
                  "maki/lodcpu/mixin/GenerationTaskMixin.class",
                  "maki/lodcpu/mixin/TaskLoaderMixin.class",
                  "maki/lodcpu/mixin/NativeCommandMixin.class",
              }
              assert required <= names, required - names
              mixins = json.loads(zf.read("maki-lod-cpu.mixins.json"))
              assert mixins["server"] == ["GenerationTaskMixin", "NativeCommandMixin", "TaskLoaderMixin"], mixins["server"]
              mods = zf.read("META-INF/neoforge.mods.toml").decode()
              assert 'version="1.3.0"' in mods
              ownership = zf.read("maki/lodcpu/TaskOwnership.class")
              for marker in (b"maki-lod-cpu-owner", b"external/unowned", b"continueOnRestart=false"):
                  assert marker in ownership, marker
          PY
          javap -p -c custom-mods/maki-lod-cpu/build/classes/java/main/maki/lodcpu/mixin/GenerationTaskMixin.class
          javap -p -c custom-mods/maki-lod-cpu/build/classes/java/main/maki/lodcpu/PlayerCenter.class

      - name: Publish updated server mod
        shell: bash
        run: |
          set -euo pipefail
          cp custom-mods/maki-lod-cpu/build/libs/maki-lod-cpu-1.3.0.jar mods/maki-lod-cpu-1.3.0.jar
          git rm mods/maki-lod-cpu-1.2.1.jar
          git add mods/maki-lod-cpu-1.3.0.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: update maki-lod-cpu to 1.3.0"
          git push origin HEAD:fix/issue-5
