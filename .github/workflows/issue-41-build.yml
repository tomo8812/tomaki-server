name: Issue 41 chunk-cache build

on:
  push:
    branches: [fix/issue-41]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-package:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[issue-41-built]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-41
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build and check chunk-cache
        run: gradle -p custom-mods/maki-chunksmith-chunk-cache clean check jar --stacktrace --no-daemon

      - name: Verify packaged metadata and source regression guard
        shell: bash
        run: |
          JAR=custom-mods/maki-chunksmith-chunk-cache/build/libs/maki-chunksmith-chunk-cache-1.0.3.jar
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'maki/chunksmithcache/BackfillController.class'
          jar tf "$JAR" | grep -q 'maki/chunksmithcache/BackfillGuard.class'
          jar tf "$JAR" | grep -q 'META-INF/sources/maki/chunksmithcache/BackfillController.java'
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -q 'version="1.0.3"'
          ! unzip -p "$JAR" META-INF/sources/maki/chunksmithcache/BackfillController.java | grep -Eq 'getChunkFuture\([^;]*ChunkStatus\.FULL,[[:space:]]*true\)'
          unzip -p "$JAR" META-INF/sources/maki/chunksmithcache/BackfillController.java | grep -q 'ChunkStatus.FULL,false'
          unzip -p "$JAR" META-INF/sources/maki/chunksmithcache/BackfillController.java | grep -q 'retiredGuardCount'
          unzip -p "$JAR" META-INF/sources/maki/chunksmithcache/BackfillController.java | grep -q 'pre-full-timeout-awaiting-future'
          unzip -p "$JAR" META-INF/sources/maki/chunksmithcache/BackfillController.java | grep -q 'releaseIdleClaim(state)'
          unzip -p "$JAR" META-INF/sources/maki/chunksmithcache/BackfillGuard.java | grep -q 'Map<String, Set<Long>>'

      - name: Replace shipped chunk-cache JAR
        shell: bash
        run: |
          set -euo pipefail
          rm -f mods/maki-chunksmith-chunk-cache-1.0.2.jar
          cp custom-mods/maki-chunksmith-chunk-cache/build/libs/maki-chunksmith-chunk-cache-1.0.3.jar mods/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A mods
          if ! git diff --cached --quiet; then
            git commit -m 'build: package chunk-cache 1.0.3 [issue-41-built]'
            git push origin HEAD:fix/issue-41
          fi
