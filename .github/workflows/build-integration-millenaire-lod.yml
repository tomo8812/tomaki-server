name: Build integrated maki-millenaire-lod

on:
  push:
    branches: [integration/millenaire-lod-issues-2-3-9]
    paths:
      - 'custom-mods/maki-millenaire-lod-compat/**'
      - '.github/workflows/build-integration-millenaire-lod.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build integrated mod
        run: gradle -p custom-mods/maki-millenaire-lod-compat clean build --stacktrace
      - name: Validate and publish jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="custom-mods/maki-millenaire-lod-compat/build/libs/maki-millenaire-lod-compat-1.0.4.jar"
          test -f "$JAR"
          unzip -t "$JAR"
          javap -classpath "$JAR" -verbose maki.millenairelod.Compat | grep -q "major version: 65"
          javap -classpath "$JAR" -p maki.millenairelod.ReservationLifecycle >/dev/null
          rm -f mods/maki-millenaire-lod-compat-1.0.2.jar mods/maki-millenaire-lod-compat-1.0.3.jar
          cp "$JAR" mods/maki-millenaire-lod-compat-1.0.4.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/maki-millenaire-lod-compat-1.0.2.jar mods/maki-millenaire-lod-compat-1.0.3.jar mods/maki-millenaire-lod-compat-1.0.4.jar
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: publish integrated maki-millenaire-lod-compat 1.0.4"
          git push
