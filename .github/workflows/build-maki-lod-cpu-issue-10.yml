name: Build maki-lod-cpu issue 10

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-10

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compile and package
        shell: bash
        run: gradle -p custom-mods/maki-lod-cpu clean build --stacktrace

      - name: Validate packaged mod
        shell: bash
        run: |
          set -euo pipefail
          JAR=custom-mods/maki-lod-cpu/build/libs/maki-lod-cpu-1.3.1.jar
          test -f "$JAR"
          jar tf "$JAR" | grep -q '^maki/lodcpu/PlayerCenter.class$'
          jar tf "$JAR" | grep -q '^maki/lodcpu/mixin/GenerationTaskMixin.class$'
          jar tf "$JAR" | grep -q '^maki/lodcpu/mixin/TaskLoaderMixin.class$'
          ! jar tf "$JAR" | grep -q 'NativeCommandMixin'
          unzip -p "$JAR" maki-lod-cpu.mixins.json | grep -q '"server": \["GenerationTaskMixin", "TaskLoaderMixin"\]'
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -q 'version="1.3.1"'
          grep -q 'event.cancelled()&&(lastTask==null||sameTaskSelection(lastTask,task))' custom-mods/maki-lod-cpu/src/main/java/maki/lodcpu/PlayerCenter.java
          javap -p -c custom-mods/maki-lod-cpu/build/classes/java/main/maki/lodcpu/mixin/GenerationTaskMixin.class | grep -q 'nativeTaskStopping'
          javap -p -c custom-mods/maki-lod-cpu/build/classes/java/main/maki/lodcpu/PlayerCenter.class | grep -q 'applyNativeTaskLifecycle'

      - name: Publish updated server mod
        shell: bash
        run: |
          set -euo pipefail
          cp custom-mods/maki-lod-cpu/build/libs/maki-lod-cpu-1.3.1.jar mods/maki-lod-cpu-1.3.1.jar
          git add mods/maki-lod-cpu-1.3.1.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: refresh maki-lod-cpu 1.3.1 after review"
          git push origin HEAD:fix/issue-10
