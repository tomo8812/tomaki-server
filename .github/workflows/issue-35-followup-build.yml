name: Issue 35 follow-up build

on:
  push:
    branches:
      - fix/issue-35
    paths:
      - 'custom-mods/maki-chunksmith-chunk-cache/**'
      - 'custom-mods/maki-lod-cpu-online-fix/build.gradle'
      - '.github/workflows/issue-35-followup-build.yml'

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[issue-35-followup-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build chunk-cache
        run: gradle -p custom-mods/maki-chunksmith-chunk-cache clean build --stacktrace --no-daemon
      - name: Check online-fix against new base JAR
        run: gradle -p custom-mods/maki-lod-cpu-online-fix clean check jar --stacktrace --no-daemon
      - name: Replace and validate chunk-cache JAR
        run: |
          set -euxo pipefail
          cp custom-mods/maki-chunksmith-chunk-cache/build/libs/maki-chunksmith-chunk-cache-1.0.2.jar mods/
          unzip -t mods/maki-chunksmith-chunk-cache-1.0.2.jar
          unzip -p mods/maki-chunksmith-chunk-cache-1.0.2.jar META-INF/sources/maki/chunksmithcache/BackfillController.java | grep -F 'failBeforeFull'
          unzip -p mods/maki-chunksmith-chunk-cache-1.0.2.jar META-INF/neoforge.mods.toml | grep -F 'version="1.0.2"'
      - name: Commit rebuilt JAR
        run: |
          set -euxo pipefail
          rm .github/workflows/issue-35-followup-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: rebuild issue 35 chunk-cache [issue-35-followup-built]"
          git push origin HEAD:fix/issue-35
