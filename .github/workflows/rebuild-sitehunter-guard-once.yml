name: Rebuild Millenaire 9.1.0 SiteHunter retention guard

on:
  push:
    branches:
      - compat/chunksmith-4.8.1-millenaire-9.1.0
    paths:
      - .github/workflows/rebuild-sitehunter-guard-once.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify upstream SiteHunter placement ABI
        run: |
          python3 .github/scripts/verify_upstream_481_910.py \
            --chunksmith 'mods/chunksmith-4.8.1+1.21.1-neoforge.jar' \
            --millenaire 'mods/millenaire-9.1.0.jar'
      - name: Build and test updated Millenaire compatibility MOD
        run: |
          gradle --no-daemon --build-cache -p custom-mods/maki-millenaire-lod-compat check jar
          install -m 0644 \
            custom-mods/maki-millenaire-lod-compat/build/libs/maki-millenaire-lod-compat-1.0.7.jar \
            mods/maki-millenaire-lod-compat-1.0.7.jar
      - name: Verify deployed MOD interoperation
        run: |
          python3 .github/scripts/check_mod_interop.py --mods-dir mods
          python3 .github/scripts/check_deployment_sources.py
      - name: Update compatibility JAR in PR branch
        run: |
          set -euo pipefail
          git add mods/maki-millenaire-lod-compat-1.0.7.jar
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(millenaire): rebuild compatibility JAR with SiteHunter retention gate'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
