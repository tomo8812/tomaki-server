name: issue47-build

on:
  push:
    branches:
      - fix/issue-47
    paths:
      - 'custom-mods/maki-chunksmith-chunk-cache/**'
      - '.github/workflows/issue-47-build.yml'

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[issue47-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-47
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and verify
        working-directory: custom-mods/maki-chunksmith-chunk-cache
        run: gradle --no-daemon clean check build
      - name: Verify and stage jar
        shell: bash
        run: |
          set -euo pipefail
          JAR=custom-mods/maki-chunksmith-chunk-cache/build/libs/maki-chunksmith-chunk-cache-1.0.4.jar
          test -f "$JAR"
          unzip -t "$JAR"
          test "$(javap -classpath "$JAR" -verbose maki.chunksmithcache.NormalChunkStorage | awk '/major version/{print $3; exit}')" = "65"
          if jar tf "$JAR" | grep -Eq '^(net/minecraft|org/spongepowered|com/kishku7|it/unimi)/'; then
            echo "Unexpected dependency classes bundled in jar" >&2
            exit 1
          fi
          rm -f mods/maki-chunksmith-chunk-cache-*.jar
          cp "$JAR" mods/
      - name: Commit verified jar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/maki-chunksmith-chunk-cache-*.jar
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: update chunk cache mod for issue 47 [issue47-build]"
          git push origin HEAD:fix/issue-47
