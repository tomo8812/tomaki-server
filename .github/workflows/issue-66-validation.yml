name: Issue 66 validation

on:
  push:
    branches: [fix/issue-66]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-66
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build and test resource governor
        run: gradle -p custom-mods/maki-lod-cpu clean check jar --stacktrace

      - name: Build and test chunk cache
        run: gradle -p custom-mods/maki-chunksmith-chunk-cache clean check jar --stacktrace

      - name: Refresh deployment JARs
        run: |
          rm -f mods/maki-lod-cpu-1.3.4.jar
          rm -f mods/maki-chunksmith-chunk-cache-1.1.1.jar
          rm -f mods/maki-lod-cpu-1.4.0.jar
          rm -f mods/maki-chunksmith-chunk-cache-1.2.0.jar
          cp custom-mods/maki-lod-cpu/build/libs/maki-lod-cpu-1.4.0.jar mods/
          cp custom-mods/maki-chunksmith-chunk-cache/build/libs/maki-chunksmith-chunk-cache-1.2.0.jar mods/

      - name: Verify source-owned deployment set
        run: python3 .github/scripts/check_deployment_sources.py

      - name: Commit deployment JARs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A mods
          if git diff --cached --quiet; then
            echo "Deployment JARs already current"
          else
            git commit -m "build: refresh issue 66 deployment jars"
            git push origin HEAD:fix/issue-66
          fi
