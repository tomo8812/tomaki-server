name: Issue 68 deployment bootstrap
# issue68-final-build-v2-4

on:
  push:
    branches:
      - fix/issue-68
    paths:
      - '.github/workflows/issue68-artifact-audit.yml'
      - 'custom-mods/maki-chunksmith-chunk-cache/**'
      - '.github/scripts/check_deployment_sources.py'

permissions:
  contents: write

jobs:
  rebuild-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build and validate maki-chunksmith-chunk-cache 1.2.1
        run: gradle --build-cache -p custom-mods/maki-chunksmith-chunk-cache check jar

      - name: Replace deployment JAR
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find custom-mods/maki-chunksmith-chunk-cache/build/libs -maxdepth 1 -type f -name 'maki-chunksmith-chunk-cache-1.2.1.jar' -print -quit)"
          test -n "$jar"
          rm -f mods/maki-chunksmith-chunk-cache-1.2.0.jar
          cp "$jar" mods/maki-chunksmith-chunk-cache-1.2.1.jar
          python3 .github/scripts/check_deployment_sources.py
          git status --short
          test -f mods/maki-chunksmith-chunk-cache-1.2.1.jar
          test ! -e mods/maki-chunksmith-chunk-cache-1.2.0.jar

      - name: Commit deployment JAR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/maki-chunksmith-chunk-cache-1.2.0.jar mods/maki-chunksmith-chunk-cache-1.2.1.jar
          git commit -m "build: ship maki-chunksmith-chunk-cache 1.2.1"
          git fetch origin fix/issue-68
          if ! git diff --quiet "$GITHUB_SHA" origin/fix/issue-68 -- custom-mods/maki-chunksmith-chunk-cache .github/scripts/check_deployment_sources.py; then
            echo "Source changed while deployment JAR was building; refusing to publish a stale artifact" >&2
            exit 75
          fi
          git rebase origin/fix/issue-68
          git push origin HEAD:fix/issue-68
