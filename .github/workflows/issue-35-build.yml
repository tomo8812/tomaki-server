name: Issue 35 custom MOD build

on:
  push:
    branches:
      - fix/issue-35
    paths:
      - 'custom-mods/maki-lod-cpu/**'
      - 'custom-mods/maki-chunksmith-chunk-cache/**'
      - 'config/maki-lod-cpu.properties'
      - '.github/workflows/issue-35-build.yml'

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[issue-35-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build maki-lod-cpu
        run: gradle -p custom-mods/maki-lod-cpu clean build --stacktrace --no-daemon

      - name: Build maki-chunksmith-chunk-cache
        run: gradle -p custom-mods/maki-chunksmith-chunk-cache clean build --stacktrace --no-daemon

      - name: Package and validate
        run: |
          set -euxo pipefail
          rm -f mods/maki-lod-cpu-1.3.1.jar mods/maki-chunksmith-chunk-cache-1.0.1.jar
          cp custom-mods/maki-lod-cpu/build/libs/maki-lod-cpu-1.3.2.jar mods/
          cp custom-mods/maki-chunksmith-chunk-cache/build/libs/maki-chunksmith-chunk-cache-1.0.2.jar mods/
          unzip -t mods/maki-lod-cpu-1.3.2.jar
          unzip -t mods/maki-chunksmith-chunk-cache-1.0.2.jar
          unzip -p mods/maki-lod-cpu-1.3.2.jar META-INF/neoforge.mods.toml | grep -F 'version="1.3.2"'
          unzip -p mods/maki-chunksmith-chunk-cache-1.0.2.jar META-INF/neoforge.mods.toml | grep -F 'version="1.0.2"'
          jar tf mods/maki-chunksmith-chunk-cache-1.0.2.jar | grep -F 'maki/chunksmithcache/IdlePregenBridge.class'
          unzip -p mods/maki-lod-cpu-1.3.2.jar META-INF/sources/maki/lodcpu/CpuGovernor.java | grep -F 'lodSavedScope'
          unzip -p mods/maki-chunksmith-chunk-cache-1.0.2.jar META-INF/sources/maki/chunksmithcache/BackfillController.java | grep -F 'maki-chunk-cache-backfill-status.json'

      - name: Commit packaged custom MODs
        run: |
          set -euxo pipefail
          rm .github/workflows/issue-35-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: package issue 35 custom mods [issue-35-built]"
          git push origin HEAD:fix/issue-35
