plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'maki.shiptracking'
version = '1.0.0'

base { archivesName = 'maki-assembly-tracking' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge { version = '21.1.262' }

dependencies {
    compileOnly files('../../mods/ValkyrienSkies-Fabric-MC1.21.1-v3.2.0-connectorfix7.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
tasks.named('jar') {
    from(sourceSets.main.allJava) { into 'META-INF/sources' }
}
