plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'maki.shipsteps'
version = '1.0.1'
base { archivesName = 'maki-ship-footsteps' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge { version = '21.1.262' }
dependencies {
    compileOnly files('../../mods/ValkyrienSkies-Fabric-MC1.21.1-v3.2.0-connectorfix7.jar')
}
sourceSets {
    connectorApi {
        java.srcDir 'src/connectorApi/java'
        compileClasspath += sourceSets.main.compileClasspath
    }
    main { compileClasspath = sourceSets.connectorApi.output + compileClasspath }
}
tasks.named('compileJava') { dependsOn tasks.named('compileConnectorApiJava') }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
tasks.named('jar') {
    from(sourceSets.main.allJava) { into 'META-INF/sources' }
}


def javapExecutable = new File(System.getProperty('java.home'), 'bin/javap').absolutePath
def vsJarPath = file('../../mods/ValkyrienSkies-Fabric-MC1.21.1-v3.2.0-connectorfix7.jar').absolutePath

tasks.register('verifyVsRuntimeAbi') {
    dependsOn tasks.named('classes')
    doLast {
        def runtime = new ProcessBuilder(
            javapExecutable,
            '-classpath', vsJarPath,
            '-p', '-s',
            'org.valkyrienskies.mod.common.VSGameUtilsKt'
        ).redirectErrorStream(true).start()
        def runtimeText = runtime.inputStream.getText('UTF-8')
        if (runtime.waitFor() != 0 ||
            !runtimeText.contains('getShipManagingPos(net.minecraft.world.level.Level, net.minecraft.core.BlockPos)') ||
            !runtimeText.contains('(Lnet/minecraft/world/level/Level;Lnet/minecraft/core/BlockPos;)Lorg/valkyrienskies/core/api/ships/Ship;')) {
            throw new GradleException('Valkyrien Skies getShipManagingPos ABI changed; expected Level + BlockPos -> Ship\n' + runtimeText)
        }

        def callsite = new ProcessBuilder(
            javapExecutable,
            '-classpath', sourceSets.main.output.classesDirs.asPath,
            '-p', '-c',
            'maki.shipsteps.mixin.ShipStepMixin'
        ).redirectErrorStream(true).start()
        def callsiteText = callsite.inputStream.getText('UTF-8')
        if (callsite.waitFor() != 0 ||
            !callsiteText.contains('VSGameUtilsKt.getShipManagingPos:(Lnet/minecraft/world/level/Level;Lnet/minecraft/core/BlockPos;)Lorg/valkyrienskies/core/api/ships/Ship;')) {
            throw new GradleException('ShipStepMixin callsite does not match the runtime BlockPos descriptor\n' + callsiteText)
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyVsRuntimeAbi')
}
