        def capturePendingMutation = cache.indexOf('LOD_PENDING.compute', captureStart)
        if (captureOwnershipGate < 0 || captureTaskGate < 0 || capturePendingMutation < 0
                || captureOwnershipGate > captureTaskGate || captureTaskGate > capturePendingMutation) {
            throw new GradleException('Issue #83 regression: external/stale Chunksmith LOD callbacks can enter unified pending/retry state')
        }
        def requestFinishStart = cache.indexOf('public static void pregenRequestFinished')
        def requestFinishEnd = cache.indexOf('public static void pregenRequestFailed', requestFinishStart)
        def requestFinishBody = cache.substring(requestFinishStart, requestFinishEnd)
        if (!requestFinishBody.contains('PREGEN_REQUEST_TARGETS.remove(key,sourceTask)')
                || !requestFinishBody.contains('PregenBorrowLedger.cancel(level,pos,sourceTask)')
                || !requestFinishBody.contains('addRetry(PREGEN_LOD_RETRY,key)')
                || !requestFinishBody.contains('invalidateChunksmithLodPresence(level,pos)')
                || !cache.contains('LodSupport.presenceIndexFor')
                || !cache.contains('index.invalidate()')) {
            throw new GradleException('Issue #83 regression: failed target request can leave provisional LOD presence authoritative')
        }
        if (!cache.contains('PromotionLedger.adoptLive(level,pos,handoff,pending==null?null:pending.result())')
                || !cache.contains('PromotionLedger.entitiesRestored(level,pos)')
                || !cache.contains('pregen-borrow-player-handoff')) {
            throw new GradleException('Issue #83 regression: player handoff must claim promotion ownership before persistence')
        }
        if (!cache.contains('PREGEN_REQUEST_TARGETS.containsKey(captureKey(level,pos))')) {
            throw new GradleException('Issue #83 regression: dependency reads can borrow target-only pregen FULL')
        }
        ['noteObservedNormalFullLod', 'noteObservedLodPresent'].each { method ->
            def start = cache.indexOf('public static void ' + method)
            def body = cache.substring(start, cache.indexOf('\n   }', start))
            if (!body.contains('!FollowCaptureOwnership.owns(level)')) {
                throw new GradleException('Issue #83 regression: external Chunksmith observations can mutate unified retry debt via ' + method)
            }
        }
        if (!chunkSave.contains('pregenPersistenceSuppressed')
                || !chunkSave.contains('suppressPregenChunkSave')
                || !entitySave.contains('pregenPersistenceSuppressed')
                || !poiSave.contains('CacheManager.suppressPregenPoiPersistence')
                || !poiBridge.contains('maki$clearPregenPoiDirty')
                || !poiBridge.contains('maki$restorePregenPoiDirty')
                || !unload.contains('pregenBorrowUnloaded')) {
            throw new GradleException('Issue #83 regression: borrowed FULL can leak into normal chunk/entity/POI storage')
        }
        def stopBody = cache.substring(cache.indexOf('public static void stop(MinecraftServer server)'),
            cache.indexOf('public static void stopped(MinecraftServer server)'))
        def stoppedBody = cache.substring(cache.indexOf('public static void stopped(MinecraftServer server)'),
            cache.indexOf('private static void rotateGenerations'))
        if (stopBody.contains('PregenBorrowLedger.clear(server)') || stopBody.contains('PromotionLedger.clear(server)')
                || !stoppedBody.contains('PregenBorrowLedger.clear(server)')
                || !stoppedBody.contains('PromotionLedger.clear(server)')
                || !stoppedBody.contains('STOPPING.add(server)')
                || stoppedBody.contains('STOPPING.remove(server)')
                || !cache.contains('private static void addRetry')
                || !mod.contains('CacheManager.stopped(event.getServer())')) {
            throw new GradleException('Issue #83 regression: shutdown/crash can clear persistence ownership early or revive dead-server retry state')
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyIssue83UnifiedPregen') }
