plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'maki.chunksmithcache'
version = '1.2.1'

base {
    archivesName = 'maki-chunksmith-chunk-cache'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.262'
}


dependencies {
    compileOnly files('../../mods/chunksmith-4.6.0+1.21.1-neoforge.jar')
    compileOnly files('../../mods/maki-idle-pregen-1.1.1.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar') {
    manifest {
        attributes(
            'Implementation-Title': 'Maki Chunksmith Chunk Cache',
            'Implementation-Version': project.version
        )
    }
    from(sourceSets.main.allJava) {
        into 'META-INF/sources'
    }
}

def registeredMixins = [
    'maki.chunksmithcache.mixin.LodSupportMixin',
    'maki.chunksmithcache.mixin.ChunkMapReadMixin',
    'maki.chunksmithcache.mixin.ChunkMapLifecycleAccessor',
    'maki.chunksmithcache.mixin.ChunkMapSaveMixin',
    'maki.chunksmithcache.mixin.SectionStorageMixin',
    'maki.chunksmithcache.mixin.EntityStorageMixin',
    'maki.chunksmithcache.mixin.ServerLevelUnloadMixin',
    'maki.chunksmithcache.mixin.MinecraftServerMixin',
    'maki.chunksmithcache.mixin.NeoForgeWorldMixin'
]

def issue47ControllerSource = file('src/main/java/maki/chunksmithcache/BackfillController.java')
def issue47GuardSource = file('src/main/java/maki/chunksmithcache/BackfillGuard.java')
def issue47StorageSource = file('src/main/java/maki/chunksmithcache/NormalChunkStorage.java')

tasks.register('verifyIssue47BackfillOwnership') {
    inputs.files(issue47ControllerSource, issue47GuardSource, issue47StorageSource)
    doLast {
        def controller = issue47ControllerSource.getText('UTF-8')
        def guard = issue47GuardSource.getText('UTF-8')
        def storage = issue47StorageSource.getText('UTF-8')
        if (!controller.contains('waiting-normal-state-unknown') || !controller.contains('waiting-dependency-scope-loaded')
                || !controller.contains('candidateDeferredUntil') || !controller.contains('snapshotBackfillOwnership')
                || !controller.contains('releaseIdlePregenClaim')) {
            throw new GradleException('Issue #47 regression: status-aware scan / deferred candidate visibility / drain claim release is missing')
        }
        if (!guard.contains('scopeAvailable') || !guard.contains('scopeDrained')
                || !guard.contains('releasePlayerOwnedDependencies') || !guard.contains('ChunkMapLifecycleAccessor')) {
            throw new GradleException('Issue #47 regression: dependency ownership / player handoff / holder drain guard is missing')
        }
        if (!storage.contains('ChunkPyramid.GENERATION_PYRAMID') || !storage.contains('State.PROTO')) {
            throw new GradleException('Issue #47 regression: vanilla dependency radius / ProtoChunk classification is missing')
        }
    }
}

def mixinClassesPath = sourceSets.main.output.classesDirs.asPath
def javapExecutable = new File(System.getProperty('java.home'), 'bin/javap').absolutePath

tasks.register('verifyMixinAnnotationRetention') {
    dependsOn tasks.named('classes')
    doLast {
        registeredMixins.each { className ->
            def process = new ProcessBuilder(
                javapExecutable,
                '-classpath', mixinClassesPath,
                '-p', '-v', className
            ).redirectErrorStream(true).start()
            def text = process.inputStream.getText('UTF-8')
            def exitCode = process.waitFor()
            if (exitCode != 0) {
                throw new GradleException("${className}: javap failed (exit ${exitCode})\n${text}")
            }

            def mixinIndex = text.lastIndexOf('org.spongepowered.asm.mixin.Mixin(')
            def invisibleIndex = text.lastIndexOf('RuntimeInvisibleAnnotations:', mixinIndex)
            def visibleIndex = text.lastIndexOf('RuntimeVisibleAnnotations:', mixinIndex)
            if (mixinIndex < 0 || invisibleIndex < 0 || visibleIndex > invisibleIndex) {
                throw new GradleException("${className}: @Mixin is not class-retained/invisible")
            }
            if (text.contains('org.spongepowered.asm.mixin.injection.Inject(') &&
                !text.contains('RuntimeVisibleAnnotations:')) {
                throw new GradleException("${className}: injector annotations are not runtime-visible")
            }
        }
    }
}

tasks.register('verifyIssue41BackfillTicketLifecycle') {
    inputs.file(layout.projectDirectory.file('src/main/java/maki/chunksmithcache/BackfillController.java'))
    doLast {
        def source = inputs.files.singleFile.getText('UTF-8')
        if (source =~ /getChunkFuture\([^;]*ChunkStatus\.FULL,\s*true\)/) {
            throw new GradleException('Issue #41 regression: backfill must not create vanilla UNKNOWN tickets via getChunkFuture(..., FULL, true)')
        }
        if (!source.contains('invokeGetChunkFutureMainThread(pos.x, pos.z, ChunkStatus.FULL, createMissingChunk)') || !source.contains('boolean createMissingChunk = false;')) {
            throw new GradleException('Issue #41 regression: owned BACKFILL_TICKET lookup is missing')
        }
        ['backfillTicketHeld', 'ticketRemovedAt', 'retiredGuards', 'MAX_RETIRED_GUARDS', 'fullLoadTimeoutReached', 'pre-full-timeout-awaiting-future'].each { field ->
            if (!source.contains(field)) {
                throw new GradleException('Issue #41 regression: lifecycle diagnostic ' + field + ' is missing')
            }
        }
        if (!source.contains('Chunk-cache backfill state: phase={}') ||
            !source.contains('waitReason={}') ||
            !source.contains('retiredGuards.size()')) {
            throw new GradleException('Issue #62 regression: backfill lifecycle must remain visible in standard logs')
        }
        if (source.contains('maki-chunk-cache-backfill-status.json') || source.contains('StatusIo')) {
            throw new GradleException('Issue #62 regression: retired backfill status-file output returned')
        }
    }
}

def issue66ControllerSource = file('src/main/java/maki/chunksmithcache/BackfillController.java')
def issue66BridgeSource = file('src/main/java/maki/chunksmithcache/LodResourceBudgetBridge.java')

tasks.register('verifyIssue66SharedBudget') {
    inputs.files(issue66ControllerSource, issue66BridgeSource)
    doLast {
        def controller = issue66ControllerSource.getText('UTF-8')
        def bridge = issue66BridgeSource.getText('UTF-8')
        if (controller.contains('chunksmithTaskActive()')) {
            throw new GradleException('Issue #66 regression: unconditional Chunksmith-task backfill blocking returned')
        }
        ['pendingCandidate', 'tryStartPending', 'reserveResourceBudget', 'waiting-shared-budget-',
         'candidate-generated-during-drain', 'LodResourceBudgetBridge.started()', 'releaseResourceBudget', 'budgetReason'].each { token ->
            if (!controller.contains(token)) {
                throw new GradleException('Issue #66 regression: shared backfill budget lifecycle is missing ' + token)
            }
        }
        ['reserveBackfill', 'backfillReservationHeld', 'backfillStarted', 'releaseBackfill'].each { token ->
            if (!bridge.contains(token)) {
                throw new GradleException('Issue #66 regression: maki-lod-cpu budget bridge is missing ' + token)
            }
        }
    }
}

def issue66CacheManagerSource = file('src/main/java/maki/chunksmithcache/CacheManager.java')
def issue66WorldMixinSource = file('src/main/java/maki/chunksmithcache/mixin/NeoForgeWorldMixin.java')
def issue66ChunksmithJar = file('../../mods/chunksmith-4.6.0+1.21.1-neoforge.jar')

tasks.register('verifyIssue66CacheVisibility') {
    inputs.files(issue66CacheManagerSource, issue66WorldMixinSource, issue66ChunksmithJar)
    doLast {
        def cache = issue66CacheManagerSource.getText('UTF-8')
        def mixin = issue66WorldMixinSource.getText('UTF-8')
        ['CAPTURE_PENDING', 'BackfillGuard.suppress', 'chunksmithGeneratedHint'].each { token ->
            if (!cache.contains(token)) throw new GradleException('Issue #66 regression: cache overlap protection missing ' + token)
        }
        if (!mixin.contains('isChunkGenerated(II)Ljava/util/concurrent/CompletableFuture;')
                || !mixin.contains('chunksmithGeneratedHint')) {
            throw new GradleException('Issue #66 regression: cache-backed generated-state Mixin missing')
        }
        def javap = new File(System.getProperty('java.home'), 'bin/javap').absolutePath
        def process = new ProcessBuilder(
            javap, '-classpath', issue66ChunksmithJar.absolutePath,
            '-p', '-s', 'com.kishku7.chunksmith.platform.NeoForgeWorld'
        ).redirectErrorStream(true).start()
        def text = process.inputStream.getText('UTF-8')
        def exit = process.waitFor()
        if (exit != 0) throw new GradleException('Issue #66: javap NeoForgeWorld failed\n' + text)
        if (!text.contains('isChunkGenerated(int, int)')
                || !text.contains('(II)Ljava/util/concurrent/CompletableFuture;')) {
            throw new GradleException('Issue #66: Chunksmith generated-state method no longer matches the cache Mixin')
        }
    }
}

tasks.register('issue40RegressionTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'maki.chunksmithcache.FingerprintPolicySelfTest'
}

tasks.register('backfillScopesTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'maki.chunksmithcache.BackfillScopesSelfTest'
}

tasks.register('issue68CompatibilityTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'maki.chunksmithcache.CompatibilityInputSelfTest'
}

tasks.named('check') {
    dependsOn tasks.named('issue68CompatibilityTest')
    dependsOn tasks.named('verifyIssue66CacheVisibility')
    dependsOn tasks.named('backfillScopesTest')
    dependsOn tasks.named('verifyMixinAnnotationRetention')
    dependsOn tasks.named('verifyIssue47BackfillOwnership')
    dependsOn tasks.named('issue40RegressionTest')
    dependsOn tasks.named('verifyIssue41BackfillTicketLifecycle')
    dependsOn tasks.named('verifyIssue66SharedBudget')
}
