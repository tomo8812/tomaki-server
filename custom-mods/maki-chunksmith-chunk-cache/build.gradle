plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'maki.chunksmithcache'
version = '1.0.4'

base {
    archivesName = 'maki-chunksmith-chunk-cache'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.262'
}

dependencies {
    compileOnly files('../../mods/chunksmith-4.6.0+1.21.1-neoforge.jar')
    compileOnly files('../../mods/maki-idle-pregen-1.0.1.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar') {
    manifest {
        attributes(
            'Implementation-Title': 'Maki Chunksmith Chunk Cache',
            'Implementation-Version': project.version
        )
    }
    from(sourceSets.main.allJava) {
        into 'META-INF/sources'
    }
}

def registeredMixins = [
    'maki.chunksmithcache.mixin.LodSupportMixin',
    'maki.chunksmithcache.mixin.ChunkMapReadMixin',
    'maki.chunksmithcache.mixin.ChunkMapLifecycleAccessor',
    'maki.chunksmithcache.mixin.ChunkMapSaveMixin',
    'maki.chunksmithcache.mixin.SectionStorageMixin',
    'maki.chunksmithcache.mixin.EntityStorageMixin',
    'maki.chunksmithcache.mixin.ServerLevelUnloadMixin',
    'maki.chunksmithcache.mixin.MinecraftServerMixin'
]

def issue47ControllerSource = file('src/main/java/maki/chunksmithcache/BackfillController.java')
def issue47GuardSource = file('src/main/java/maki/chunksmithcache/BackfillGuard.java')
def issue47StorageSource = file('src/main/java/maki/chunksmithcache/NormalChunkStorage.java')

tasks.register('verifyIssue47BackfillOwnership') {
    inputs.files(issue47ControllerSource, issue47GuardSource, issue47StorageSource)
    doLast {
        def controller = issue47ControllerSource.getText('UTF-8')
        def guard = issue47GuardSource.getText('UTF-8')
        def storage = issue47StorageSource.getText('UTF-8')
        if (!controller.contains('waiting-normal-state-unknown') || !controller.contains('snapshotBackfillOwnership')
                || !controller.contains('releaseIdlePregenClaim')) {
            throw new GradleException('Issue #47 regression: status-aware scan / drain claim release is missing')
        }
        if (!guard.contains('scopeAvailable') || !guard.contains('scopeDrained') || !guard.contains('ChunkMapLifecycleAccessor')) {
            throw new GradleException('Issue #47 regression: dependency ownership / holder drain guard is missing')
        }
        if (!storage.contains('ChunkPyramid.GENERATION_PYRAMID') || !storage.contains('State.PROTO')) {
            throw new GradleException('Issue #47 regression: vanilla dependency radius / ProtoChunk classification is missing')
        }
    }
}

def mixinClassesPath = sourceSets.main.output.classesDirs.asPath
def javapExecutable = new File(System.getProperty('java.home'), 'bin/javap').absolutePath

tasks.register('verifyMixinAnnotationRetention') {
    dependsOn tasks.named('classes')
    doLast {
        registeredMixins.each { className ->
            def process = new ProcessBuilder(
                javapExecutable,
                '-classpath', mixinClassesPath,
                '-p', '-v', className
            ).redirectErrorStream(true).start()
            def text = process.inputStream.getText('UTF-8')
            def exitCode = process.waitFor()
            if (exitCode != 0) {
                throw new GradleException("${className}: javap failed (exit ${exitCode})\n${text}")
            }

            def mixinIndex = text.lastIndexOf('org.spongepowered.asm.mixin.Mixin(')
            def invisibleIndex = text.lastIndexOf('RuntimeInvisibleAnnotations:', mixinIndex)
            def visibleIndex = text.lastIndexOf('RuntimeVisibleAnnotations:', mixinIndex)
            if (mixinIndex < 0 || invisibleIndex < 0 || visibleIndex > invisibleIndex) {
                throw new GradleException("${className}: @Mixin is not class-retained/invisible")
            }
            if (text.contains('org.spongepowered.asm.mixin.injection.Inject(') &&
                !text.contains('RuntimeVisibleAnnotations:')) {
                throw new GradleException("${className}: injector annotations are not runtime-visible")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyMixinAnnotationRetention')
    dependsOn tasks.named('verifyIssue47BackfillOwnership')
}
