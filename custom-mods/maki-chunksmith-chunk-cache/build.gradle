plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'maki.chunksmithcache'
version = '1.4.0'

base {
    archivesName = 'maki-chunksmith-chunk-cache'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.262'
}


dependencies {
    compileOnly files('../../mods/chunksmith-4.6.0+1.21.1-neoforge.jar')
    compileOnly files('../../mods/maki-idle-pregen-1.1.1.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar') {
    manifest {
        attributes(
            'Implementation-Title': 'Maki Chunksmith Chunk Cache',
            'Implementation-Version': project.version
        )
    }
    from(sourceSets.main.allJava) {
        into 'META-INF/sources'
    }
}

