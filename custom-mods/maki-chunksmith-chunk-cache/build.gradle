plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'maki.chunksmithcache'
version = '1.5.0'

base {
    archivesName = 'maki-chunksmith-chunk-cache'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.262'
}


dependencies {
    compileOnly files('../../mods/chunksmith-4.8.1+1.21.1-neoforge.jar')
    compileOnly files('../../mods/maki-chunksmith-controller-1.4.2.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar') {
    manifest {
        attributes(
            'Implementation-Title': 'Maki Chunksmith Chunk Cache',
            'Implementation-Version': project.version
        )
    }
    from(sourceSets.main.allJava) {
        into 'META-INF/sources'
    }
}

def registeredMixins = [
    'maki.chunksmithcache.mixin.ChunkMapReadMixin',
    'maki.chunksmithcache.mixin.ChunkMapLifecycleAccessor',
    'maki.chunksmithcache.mixin.ChunkMapSaveMixin',
    'maki.chunksmithcache.mixin.SectionStorageMixin',
    'maki.chunksmithcache.mixin.EntityStorageMixin',
    'maki.chunksmithcache.mixin.ServerLevelUnloadMixin',
    'maki.chunksmithcache.mixin.NeoForgeWorldMixin',
    'maki.chunksmithcache.mixin.ServerLevelEntityAccessor',
    'maki.chunksmithcache.mixin.EntitySectionManagerAccessor',
    'maki.chunksmithcache.mixin.EntityStorageWriteAckMixin',
    'maki.chunksmithcache.mixin.LevelChunkPostLoadMixin'
]

def mixinClassesPath = sourceSets.main.output.classesDirs.asPath
def javapExecutable = new File(System.getProperty('java.home'), 'bin/javap').absolutePath

tasks.register('verifyMixinAnnotationRetention') {
    dependsOn tasks.named('classes')
    doLast {
        registeredMixins.each { className ->
            def process = new ProcessBuilder(
                javapExecutable,
                '-classpath', mixinClassesPath,
                '-p', '-v', className
            ).redirectErrorStream(true).start()
            def text = process.inputStream.getText('UTF-8')
            def exitCode = process.waitFor()
            if (exitCode != 0) {
                throw new GradleException("${className}: javap failed (exit ${exitCode})\n${text}")
            }

            def mixinIndex = text.lastIndexOf('org.spongepowered.asm.mixin.Mixin(')
            def invisibleIndex = text.lastIndexOf('RuntimeInvisibleAnnotations:', mixinIndex)
            def visibleIndex = text.lastIndexOf('RuntimeVisibleAnnotations:', mixinIndex)
            if (mixinIndex < 0 || invisibleIndex < 0 || visibleIndex > invisibleIndex) {
                throw new GradleException("${className}: @Mixin is not class-retained/invisible")
            }
            if (text.contains('org.spongepowered.asm.mixin.injection.Inject(') &&
                !text.contains('RuntimeVisibleAnnotations:')) {
                throw new GradleException("${className}: injector annotations are not runtime-visible")
            }
        }
    }
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

['fullSaveCompletionTest':'FullSaveCompletionSelfTest',
 'captureTelemetryTest':'CaptureTelemetrySelfTest',
 'cacheRetentionSettingsTest':'CacheRetentionPolicySelfTest',
 'cachePipelineTest':'CachePipelineSelfTest',
 'fullCacheCompatibilityTest':'FullCacheCompatibilitySelfTest'].each { taskName, className ->
    tasks.register(taskName, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'maki.chunksmithcache.' + className
        systemProperty 'cachePipeline.minecraftJar', file('build/moddev/artifacts/neoforge-21.1.262.jar').absolutePath
    }
    tasks.named('check') { dependsOn tasks.named(taskName) }
}
tasks.named('check') { dependsOn tasks.named('verifyMixinAnnotationRetention') }
