plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'maki.mapshare'
version = '1.1.1'

base {
    archivesName = 'maki-diorama-share'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        url = uri('https://api.modrinth.com/maven')
    }
}

neoForge {
    version = '21.1.262'
}

dependencies {
    compileOnly files('../../mods/diorama-0.10.1+neoforge-1.21.1.jar')
    testImplementation files('../../mods/diorama-0.10.1+neoforge-1.21.1.jar')
    testImplementation 'org.ow2.asm:asm-tree:9.8'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test') {
    useJUnitPlatform()
    inputs.file('../../config/diorama-server.properties')
    systemProperty 'maki.serverConfig', file('../../config/diorama-server.properties').absolutePath
}

tasks.named('jar') {
    preserveFileTimestamps = false
    reproducibleFileOrder = true

    manifest {
        attributes(
            'Implementation-Title': 'Maki Diorama Sharing',
            'Implementation-Version': project.version
        )
    }

    from(sourceSets.main.allJava) {
        into 'META-INF/sources'
    }
}
