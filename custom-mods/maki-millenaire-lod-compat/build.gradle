plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'maki.millenairelod'
version = '1.0.10'

base {
    archivesName = 'maki-millenaire-lod-compat'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.262'
}


dependencies {
    compileOnly files('../../mods/chunksmith-4.8.1+1.21.1-neoforge.jar')
    compileOnly files('../../mods/millenaire-9.1.0.jar')
    compileOnly files('../../mods/maki-chunksmith-chunk-cache-1.5.0.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar') {
    manifest {
        attributes(
            'Implementation-Title': 'Maki Millenaire Chunksmith Compatibility',
            'Implementation-Version': project.version
        )
    }

    from(sourceSets.main.allJava) {
        into 'META-INF/sources'
    }
}

def registeredMixins = [
    'maki.millenairelod.mixin.MillenaireMixin',
    'maki.millenairelod.mixin.LoneCandidateAccessor',
    'maki.millenairelod.mixin.SpawnQueueMixin',
    'maki.millenairelod.mixin.SiteHunterMixin',
    'maki.millenairelod.mixin.VillageQueueAccessor',
    'maki.millenairelod.mixin.SiteHunterWorkAccessor'
]

def mixinClassesPath = sourceSets.main.output.classesDirs.asPath
def javapExecutable = new File(System.getProperty('java.home'), 'bin/javap').absolutePath
def chunksmithJarPath = file('../../mods/chunksmith-4.8.1+1.21.1-neoforge.jar').absolutePath

tasks.register('verifyMixinAnnotationRetention') {
    dependsOn tasks.named('classes')
    doLast {
        registeredMixins.each { className ->
            def process = new ProcessBuilder(
                javapExecutable,
                '-classpath', mixinClassesPath,
                '-p', '-v', className
            ).redirectErrorStream(true).start()
            def text = process.inputStream.getText('UTF-8')
            def exitCode = process.waitFor()
            if (exitCode != 0) {
                throw new GradleException(className + ': javap failed (exit ' + exitCode + ')\n' + text)
            }
            def mixinIndex = text.lastIndexOf('org.spongepowered.asm.mixin.Mixin(')
            def invisibleIndex = text.lastIndexOf('RuntimeInvisibleAnnotations:', mixinIndex)
            def visibleIndex = text.lastIndexOf('RuntimeVisibleAnnotations:', mixinIndex)
            if (mixinIndex < 0 || invisibleIndex < 0 || visibleIndex > invisibleIndex) {
                throw new GradleException(className + ': @Mixin is not class-retained/invisible')
            }
            if ((text.contains('org.spongepowered.asm.mixin.injection.Inject(') ||
                 text.contains('org.spongepowered.asm.mixin.injection.Redirect(')) &&
                !text.contains('RuntimeVisibleAnnotations:')) {
                throw new GradleException(className + ': injector annotations are not runtime-visible')
            }
        }
    }
}

tasks.named('check') { dependsOn tasks.named('verifyMixinAnnotationRetention') }

tasks.register('replayBudgetTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'maki.millenairelod.ReplayBudgetSelfTest'
}
tasks.named('check') { dependsOn tasks.named('replayBudgetTest') }

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

tasks.register('deferredDataTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'maki.millenairelod.DeferredDataSelfTest'
}
tasks.named('check') { dependsOn tasks.named('deferredDataTest') }
