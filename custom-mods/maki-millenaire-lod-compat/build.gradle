plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'maki.millenairelod'
version = '1.0.4'

base {
    archivesName = 'maki-millenaire-lod-compat'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.262'
}

dependencies {
    compileOnly files('../../mods/maki-millenaire-lod-compat-1.0.3.jar')
    compileOnly files('../../mods/chunksmith-4.6.0+1.21.1-neoforge.jar')
    compileOnly files('../../mods/millenaire-9.0.3.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.main.allJava) {
        into 'META-INF/sources'
    }
    from(zipTree('../../mods/maki-millenaire-lod-compat-1.0.3.jar'))
}
