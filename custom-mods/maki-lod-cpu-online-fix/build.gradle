plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'maki.lodcpu.onlinefix'
version = '1.0.2'
base.archivesName = 'maki-lod-cpu-online-fix'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.262'
}

dependencies {
    compileOnly files('../../mods/maki-lod-cpu-1.3.1.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar') {
    manifest {
        attributes('Implementation-Title': 'Maki LOD CPU Online Limit Fix',
                   'Implementation-Version': project.version)
    }
}
