plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'maki.lodcpu'
version = '1.3.3'

base {
    archivesName = 'maki-lod-cpu'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.262'
}

def builtStatusIo = file('../maki-status-io/build/libs/maki-status-io-1.0.0.jar')
def shippedStatusIo = file('../../mods/maki-status-io-1.0.0.jar')

dependencies {
    compileOnly files('../../mods/chunksmith-4.6.0+1.21.1-neoforge.jar')
    compileOnly files(builtStatusIo.exists() ? builtStatusIo : shippedStatusIo)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar') {
    from(sourceSets.main.allJava) {
        into 'META-INF/sources'
    }
}
