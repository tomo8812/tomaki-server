plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'maki.lodcpu'
version = '1.4.2'

base {
    archivesName = 'maki-lod-cpu'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.262'
}


dependencies {
    compileOnly files('../../mods/chunksmith-4.6.0+1.21.1-neoforge.jar')
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    from(sourceSets.main.allJava) {
        into 'META-INF/sources'
    }
}

def issue66BudgetSource = file('src/main/java/maki/lodcpu/SharedWorkBudget.java')
def issue66ApiSource = file('src/main/java/maki/lodcpu/ResourceBudgetApi.java')
def issue66MixinSource = file('src/main/java/maki/lodcpu/mixin/GenerationTaskMixin.java')

tasks.register('verifyIssue66SharedScheduling') {
    inputs.files(issue66BudgetSource, issue66ApiSource, issue66MixinSource)
    doLast {
        def budget = issue66BudgetSource.getText('UTF-8')
        def api = issue66ApiSource.getText('UTF-8')
        def mixin = issue66MixinSource.getText('UTF-8')
        ['draining-follow-dispatch', 'dynamic-cooldown', 'waiting-clean-follow-sample', 'noteCleanFollowSample', 'blockFollowDispatch', 'backfillStarted'].each { token ->
            if (!budget.contains(token)) throw new GradleException('Issue #66 regression: shared scheduler missing ' + token)
        }
        ['activeTaskMode', 'TaskOwnership.isOwned', 'noteFollowInFlight'].each { token ->
            if (!api.contains(token)) throw new GradleException('Issue #66 regression: resource API ownership/drain handshake missing ' + token)
        }
        ['maki$sharedBackfillBarrier', 'ResourceBudgetApi.blockFollowDispatch', 'LockSupport.parkNanos'].each { token ->
            if (!mixin.contains(token)) throw new GradleException('Issue #66 regression: non-stopping follow dispatch barrier missing ' + token)
        }
        def reserveStart=api.indexOf('public static String reserveBackfill')
        def reserveEnd=api.indexOf('public static boolean backfillReservationHeld',reserveStart)
        def reserveBody=api.substring(reserveStart,reserveEnd)
        if (api.contains('requestBackfillExclusivePause') || reserveBody.contains('PlayerCenter.')) {
            throw new GradleException('Issue #66 regression: Backfill must not stop/restart the follow task lifecycle')
        }
    }
}

def chunksmithIssue66Jar = file('../../mods/chunksmith-4.6.0+1.21.1-neoforge.jar')

tasks.register('verifyIssue66ChunksmithBytecode') {
    inputs.file(chunksmithIssue66Jar)
    doLast {
        def javap = new File(System.getProperty('java.home'), 'bin/javap').absolutePath
        def process = new ProcessBuilder(
            javap, '-classpath', chunksmithIssue66Jar.absolutePath,
            '-p', '-c', 'com.kishku7.chunksmith.GenerationTask'
        ).redirectErrorStream(true).start()
        def text = process.inputStream.getText('UTF-8')
        def exit = process.waitFor()
        if (exit != 0) throw new GradleException('Issue #66: javap GenerationTask failed\n' + text)
        if (!text.contains('ChunkIterator.next:()Ljava/lang/Object;')) {
            throw new GradleException('Issue #66: Chunksmith iterator bytecode no longer matches the dispatch-barrier Mixin target')
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyIssue66SharedScheduling')
    dependsOn tasks.named('verifyIssue66ChunksmithBytecode')
}


def issue83PlayerCenter = file('src/main/java/maki/lodcpu/PlayerCenter.java')
def issue83Reset = file('src/main/java/maki/lodcpu/UnifiedPregenReset.java')
def issue83Governor = file('src/main/java/maki/lodcpu/CpuGovernor.java')
def issue83Mod = file('src/main/java/maki/lodcpu/MakiLodCpu.java')

tasks.register('verifyIssue83UnifiedFollow') {
    inputs.files(issue83PlayerCenter, issue83Reset, issue83Governor, issue83Mod)
    doLast {
        def center = issue83PlayerCenter.getText('UTF-8')
        def reset = issue83Reset.getText('UTF-8')
        def governor = issue83Governor.getText('UTF-8')
        def mod = issue83Mod.getText('UTF-8')
        ['if(online){', 'pipeline-pressure:', 'retrying-incomplete-pairs', 'saved.x=0;saved.z=0'].each { token ->
            if (!center.contains(token)) throw new GradleException('Issue #83 regression: empty-server unified follow policy missing ' + token)
        }
        ['chunksmith_chunk_cache', 'resolve("chunksmith").resolve("lod")', 'minecraft_overworld', '.promotions', '.nbt.gz.in-use', 'maki_pregen_unified_v1.reset'].each { token ->
            if (!reset.contains(token)) throw new GradleException('Issue #83 regression: one-time disposable-state reset missing ' + token)
        }
        def prepareStart = reset.indexOf('static synchronized void prepareBeforeLod')
        def ensureStart = reset.indexOf('static synchronized boolean ensure')
        def ensureEnd = reset.indexOf('static synchronized void stopped', ensureStart)
        if (!mod.contains('ServerAboutToStartEvent') || !mod.contains('UnifiedPregenReset.prepareBeforeLod')
                || prepareStart < 0 || ensureStart <= prepareStart || ensureEnd <= ensureStart) {
            throw new GradleException('Issue #83 regression: disposable LOD reset is not bound to the pre-LOD server lifecycle')
        }
        def prepareBody = reset.substring(prepareStart, ensureStart)
        def ensureBody = reset.substring(ensureStart, ensureEnd)
        if (!prepareBody.contains('resolve("chunksmith").resolve("lod").resolve("minecraft_overworld")')
                || !prepareBody.contains('resetPregenCacheDimension(')
                || !ensureBody.contains('preparedServer!=server||!storagePrepared')) {
            throw new GradleException('Issue #83 regression: startup-only disposable storage reset/gate is incomplete')
        }
        if (ensureBody.contains('resolve("chunksmith").resolve("lod")')
                || ensureBody.contains('resetPregenCacheDimension(')) {
            throw new GradleException('Issue #83 regression: live follow tick can delete an open Chunksmith LOD store')
        }
        if (!governor.contains('pregenRetryPending') || !governor.contains('pipelinePressure()')
                || !governor.contains('pregenReady')) {
            throw new GradleException('Issue #83 regression: unified retry/pressure/readiness bridge missing')
        }
        if (!center.contains('waiting-pregen-fingerprint')) {
            throw new GradleException('Issue #83 regression: generation can start before cache identity is ready')
        }
        if (!center.contains('persistedOwner==TaskOwnership.PersistedOwner.PREVIOUS_SESSION&&chunky.getConfig().getContinueOnRestart()')
                || !center.contains('task=new GenerationTask(chunky,selection)')
                || !center.contains('PlayerCenter-persisted-rewind')) {
            throw new GradleException('Issue #83 regression: previous-session follow progress can skip in-memory retry debt after restart')
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyIssue83UnifiedFollow') }

def pregenV2PlayerCenter = file('src/main/java/maki/lodcpu/PlayerCenter.java')
def pregenV2ResourceApi = file('src/main/java/maki/lodcpu/ResourceBudgetApi.java')
def pregenV2GenerationMixin = file('src/main/java/maki/lodcpu/mixin/GenerationTaskMixin.java')
def pregenV2Policy = file('src/main/java/maki/lodcpu/AdaptivePolicy.java')
def pregenV2Governor = file('src/main/java/maki/lodcpu/CpuGovernor.java')

tasks.register('verifyPregenControllerV2') {
    inputs.files(pregenV2PlayerCenter,pregenV2ResourceApi,pregenV2GenerationMixin,pregenV2Policy,pregenV2Governor)
    doLast {
        def center=pregenV2PlayerCenter.getText('UTF-8')
        def api=pregenV2ResourceApi.getText('UTF-8')
        def mixin=pregenV2GenerationMixin.getText('UTF-8')
        def policy=pregenV2Policy.getText('UTF-8')
        def governor=pregenV2Governor.getText('UTF-8')
        ['ADMISSION_EPOCH','admissionClosed','closeAdmission()','admissionEpoch(GenerationTask task)',
         'admissionOpen(GenerationTask task)','server.getPlayerCount()>0','nativeTaskStopping'].each { token ->
            if(!center.contains(token))throw new GradleException('Pregen V2 regression: stop epoch/admission policy missing '+token)
        }
        ['blockFollowAdmission','followAdmissionEpoch','followAdmissionOpen'].each { token ->
            if(!api.contains(token))throw new GradleException('Pregen V2 regression: admission bridge missing '+token)
        }
        def gate=mixin.indexOf('ResourceBudgetApi.blockFollowAdmission()')
        def next=mixin.indexOf('Object next=iterator.next()')
        if(gate<0||next<0||gate>next)throw new GradleException('Pregen V2 regression: WIP gate must run before iterator consumption')
        ['candidateCap=cap-1','candidateCap=cap+1','pairCompletions','fastSignature',
         'fast-state-changed','trial-downstream-constrained'].each { token ->
            if(!policy.contains(token))throw new GradleException('Pregen V2 regression: c-neighbourhood policy missing '+token)
        }
        if(!governor.contains('pairConfirmedRuntime')||!governor.contains('setFastTuningFrozen("probe".equals(POLICY.phase))'))
            throw new GradleException('Pregen V2 regression: confirmed PAIR objective/FAST trial freeze missing')
    }
}
tasks.named('check') { dependsOn tasks.named('verifyPregenControllerV2') }
