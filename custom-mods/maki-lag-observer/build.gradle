plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'maki.lagobserver'
version = '1.1.0'

base {
    archivesName = 'maki-lag-observer'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.262'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar') {
    manifest {
        attributes(
            'Implementation-Title': 'Maki Lag Observer',
            'Implementation-Version': project.version
        )
    }
    from(sourceSets.main.allJava) {
        into 'META-INF/sources'
    }
}

tasks.register('verifyMixinAnnotationRetention') {
    dependsOn tasks.named('classes')
    doLast {
        def javap = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get().metadata.installationPath.file('bin/javap').asFile
        [
            'maki.lagobserver.mixin.CompoundTagMixin',
            'maki.lagobserver.mixin.ListTagMixin',
            'maki.lagobserver.mixin.MinecraftServerMixin'
        ].each { className ->
            def process = new ProcessBuilder(
                javap.absolutePath,
                '-classpath', sourceSets.main.output.classesDirs.asPath,
                '-p', '-v', className
            ).redirectErrorStream(true).start()
            def text = process.inputStream.getText('UTF-8')
            if (process.waitFor() != 0) {
                throw new GradleException('javap failed for ' + className + ': ' + text)
            }
            def classAnnotationIndex = text.lastIndexOf('org.spongepowered.asm.mixin.Mixin(')
            def invisibleIndex = text.lastIndexOf('RuntimeInvisibleAnnotations:', classAnnotationIndex)
            if (classAnnotationIndex < 0 || invisibleIndex < 0 || invisibleIndex > classAnnotationIndex) {
                throw new GradleException('@Mixin is not RuntimeInvisibleAnnotations for ' + className)
            }
            if (!text.contains('RuntimeVisibleAnnotations:') ||
                !text.contains('org.spongepowered.asm.mixin.injection.Inject(')) {
                throw new GradleException('injector annotations are not runtime-visible for ' + className)
            }
        }
    }
}

tasks.register('verifyNbtCopyTargets') {
    dependsOn tasks.named('classes')
    doLast {
        def javap = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get().metadata.installationPath.file('bin/javap').asFile
        def classpath = sourceSets.main.compileClasspath.asPath
        [
            'net.minecraft.nbt.CompoundTag': 'public net.minecraft.nbt.CompoundTag copy();',
            'net.minecraft.nbt.ListTag': 'public net.minecraft.nbt.ListTag copy();'
        ].each { className, expected ->
            def process = new ProcessBuilder(
                javap.absolutePath,
                '-classpath', classpath,
                '-p', className
            ).redirectErrorStream(true).start()
            def text = process.inputStream.getText('UTF-8')
            if (process.waitFor() != 0) {
                throw new GradleException('javap failed for target ' + className + ': ' + text)
            }
            if (!text.contains(expected)) {
                throw new GradleException('Expected NBT copy target not found in ' + className + ': ' + expected)
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyMixinAnnotationRetention')
    dependsOn tasks.named('verifyNbtCopyTargets')
}
