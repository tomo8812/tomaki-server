plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'maki.shipanchor'
version = '1.1.2'

base {
    archivesName = 'maki-ship-anchor-fix'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.262'
}

dependencies {
    compileOnly files('../../mods/ValkyrienSkies-Fabric-MC1.21.1-v3.2.0-connectorfix7.jar')
}

// The server runs the Fabric VS2 JAR through Sinytra Connector. The raw JAR uses
// intermediary Minecraft names, while the transformed runtime API is Mojmap.
// Compile the tiny named-signature facade separately and put it ahead of the raw
// VS2 JAR only for javac. It is never included in the produced mod JAR.
sourceSets {
    connectorApi {
        java.srcDir 'src/connectorApi/java'
        compileClasspath += sourceSets.main.compileClasspath
    }
    main {
        compileClasspath = sourceSets.connectorApi.output + compileClasspath
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('compileConnectorApiJava')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar') {
    manifest {
        attributes(
            'Implementation-Title': 'Maki Ship Anchor Fix',
            'Implementation-Version': project.version
        )
    }
    from(sourceSets.main.allJava) {
        into 'META-INF/sources'
    }
}

def registeredMixins = [
    'maki.shipanchor.mixin.EntityPassengerAnchorMixin',
    'maki.shipanchor.mixin.LivingSleepAnchorMixin',
    'maki.shipanchor.mixin.SleepDragMixin',
    'maki.shipanchor.mixin.AirshipSleepCompatMixin',
    'maki.shipanchor.mixin.ServerGamePacketListenerBaselineMixin'
]

def mixinClassesPath = sourceSets.main.output.classesDirs.asPath
def javapExecutable = new File(System.getProperty('java.home'), 'bin/javap').absolutePath

tasks.register('verifyMixinAnnotationRetention') {
    dependsOn tasks.named('classes')
    doLast {
        registeredMixins.each { className ->
            def process = new ProcessBuilder(
                javapExecutable,
                '-classpath', mixinClassesPath,
                '-p', '-v', className
            ).redirectErrorStream(true).start()
            def text = process.inputStream.getText('UTF-8')
            def exitCode = process.waitFor()
            if (exitCode != 0) {
                throw new GradleException("${className}: javap failed (exit ${exitCode})\n${text}")
            }

            def mixinIndex = text.lastIndexOf('org.spongepowered.asm.mixin.Mixin(')
            def invisibleIndex = text.lastIndexOf('RuntimeInvisibleAnnotations:', mixinIndex)
            def visibleIndex = text.lastIndexOf('RuntimeVisibleAnnotations:', mixinIndex)
            if (mixinIndex < 0 || invisibleIndex < 0 || visibleIndex > invisibleIndex) {
                throw new GradleException("${className}: @Mixin is not class-retained/invisible")
            }
            if (text.contains('org.spongepowered.asm.mixin.injection.Inject(') &&
                !text.contains('RuntimeVisibleAnnotations:')) {
                throw new GradleException("${className}: injector annotations are not runtime-visible")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyMixinAnnotationRetention')
}
