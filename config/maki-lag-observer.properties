# Low-overhead diagnostics for Issue #36.
enabled=true
watchdog-interval-ms=100
stall-threshold-ms=500
stall-sample-interval-ms=500
long-tick-threshold-ms=200
tick-start-gap-threshold-ms=500
top-threads=8
max-stack-frames=128

# Targeted tracing for slow top-level Minecraft NBT deep copies.
# Hooks run only on the server thread. Full stacks are captured only after a copy
# crosses this threshold, and slow-copy log writes use a bounded daemon queue.
nbt-copy-observer-enabled=true
nbt-copy-threshold-ms=50
nbt-copy-max-stack-frames=192
