# Server-only Chunksmith 4.6.0 throughput controller, version 1.4.2.
# CPU is diagnostic and changes probe size; high CPU alone does not reduce idle generation.
# 0 = detect Linux online CPUs, process affinity and cgroup CPU quota (A1 target: 2).
cpu-capacity-cores=0
min-concurrent=1
max-concurrent=64
sample-seconds=2

# Compare A / B / A pipeline throughput, with native storage writes and request completions.
# Settling and retry intervals keep generating; they do not pause the task.
throughput-window-seconds=30
throughput-settle-seconds=8
throughput-retry-seconds=60
throughput-minimum-events=8
throughput-max-step=8
throughput-minimum-gain-percent=5
no-progress-seconds=60

# Independent resource-pressure controls; the native Chunksmith guards remain enabled.
mspt-decrease-at=50
mspt-emergency-at=100
heap-decrease-at-percent=75
minimum-system-headroom-mb=512
gc-pressure-percent=20

# Low-priority real-chunk backfill shares this resource budget with follow LOD.
# CPU saturation by itself is intentionally not a blocker. Admission uses
# tick health, memory/GC, I/O PSI and native storage/backpressure signals.
#
# The follow GenerationTask is never stop/resume cycled for Backfill. Once a
# safe candidate exists, new follow dispatch is held only long enough for its
# existing in-flight requests to drain; one Backfill then runs and dispatch
# resumes. The next slice is spaced dynamically from observed Backfill cost
# and LOD/storage progress.
backfill-io-pressure-percent=25
backfill-memory-psi-pressure-percent=25
backfill-lod-queue-high=64
backfill-write-queue-high=32
backfill-min-spacing-seconds=2
# Effective minimum follow time is max(backfill-min-spacing, 2 * sample-seconds).
# The first governor sample after a Backfill contains the release transition and
# is excluded from A/B/A throughput measurement; this leaves at least one later
# clean follow-only sample before another Backfill can reserve.
# Nominal cooldown is capped by this value. An unusually long generation lease
# additionally repays its measured Follow service debt; this is not a per-target
# retry deadline. Storage waits do not hold that generation lease.
# The configured maximum must be at least the effective minimum above.
backfill-max-safe-wait-seconds=30
# Give up a requested slice if owned follow work cannot drain safely.
backfill-drain-wait-seconds=30
backfill-sample-max-age-seconds=10

# Single named-player center and LOD-only generation. Online generation stays disabled.
follow-enabled=true
follow-player=tomo8812
follow-player-uuid=9845d198-4c17-4be1-a109-b96b7e42aef9
online-max-concurrent=2
follow-radius-blocks=4096
follow-recenter-seconds=30
follow-empty-grace-seconds=0
generate-while-online=false
