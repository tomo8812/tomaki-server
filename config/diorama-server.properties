# Diorama 0.10.1: share normally saved, fully generated terrain for client-side mapping.
share-map=true
share-land=generated
# Per-player transfer allowance in KiB/s. Rendering stays on each client.
share-kilobytes-per-second=500

# Server-side web map: draw saved terrain and serve it on TCP port 8100.
web-map=true
web-map-port=8100
web-map-address=
web-map-folder=
