# Maki Mods Observer diagnostics are opt-in. Normal status belongs in latest.log.
enabled=false
watchdog-interval-ms=100
stall-threshold-ms=500
stall-sample-interval-ms=500
long-tick-threshold-ms=200
tick-start-gap-threshold-ms=500
top-threads=8
max-stack-frames=128
# Bounds apply independently to each diagnostic stream for one unchanged config session.
# Change/rewrite this config to explicitly start a new diagnostic session.
diagnostic-max-duration-minutes=30
diagnostic-max-events=5000
# Per diagnostic output file; writing stops at this size until it is rotated/removed.
diagnostic-max-file-mb=16

# Slow top-level Minecraft NBT deep-copy tracing. Also opt-in.
nbt-copy-observer-enabled=false
nbt-copy-threshold-ms=50
nbt-copy-max-stack-frames=192
