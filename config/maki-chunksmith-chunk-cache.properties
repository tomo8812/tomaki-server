# FULL chunk cache storage settings.
# Chunksmith owns native LOD reuse; this MOD stores and restores FULL chunks.
# No Minecraft version, world seed, generation MOD, config or datapack monitoring.
# Older cache folders are adopted by validating the saved FULL NBT itself.

# Retention for corrupt/incomplete cache files and historical quarantine data.
quarantine.retention-days=30
quarantine.max-generations=8
quarantine.max-bytes=53687091200
quarantine.min-protection-hours=24

# Cache capacity and available disk space reserved for normal world storage.
cache.max-active-bytes=16106127360
cache.minimum-free-bytes=2147483648
