# Compatibility fingerprint policy for maki-chunksmith-chunk-cache.
# Generation compatibility is based on Chunksmith/effective worldgen inputs and world identity,
# not on every installed MOD/config byte. Cache serialization schema is validated per entry.

# Optional server-root relative paths known to be generation-neutral.
# Supports exact paths, '*' within a single path segment, and a trailing '/**' subtree rule.
# Built-in generation-sensitive paths remain protected. Chunksmith task progress is always excluded.
fingerprint.ignore-paths=config/maki-mods-observer.properties

# Optional extra MOD IDs whose code changes generated terrain/structures/biomes/village results.
# Built-ins cover Chunksmith, EpicTerrain, Millenaire, terrain_slabs, worldgenfeaturefix,
# zfastnoise and maki-millenaire-lod. JARs containing datapack worldgen/structure/dimension
# resources are also detected automatically. Ordinary QoL/runtime MODs are neutral by default.
fingerprint.generation-sensitive-mod-ids=

# Optional extra server-root relative config paths that change generated results.
# Use this when a code-driven worldgen MOD has generation settings outside the built-in paths.
fingerprint.generation-sensitive-paths=

# Optional exact-SHA generated-result contract attestations for reviewed future releases.
# Format: mod_id:sha256:contract,mod_id:sha256:contract
# Example workflow for a future maki_millenaire_lod release: audit the exact JAR first, then
# map its SHA-256 to millenaire-disposable-generation-v1 before deployment. A byte mismatch
# remains generation-sensitive/fail-closed; an unattested JAR is never neutralized by version/name.
fingerprint.generation-contract-attestations=

# Historical/quarantined data is never deleted automatically. These thresholds only emit warnings.
# Irreversible deletion remains an explicit administrator action.
quarantine.warn-generations=8
quarantine.warn-bytes=53687091200

# Cache write admission. Leave room for authoritative normal world/entity/POI saves.
# Under pressure, new cache writes stop rather than deleting retained cache generations.
cache.max-active-bytes=21474836480
cache.minimum-free-bytes=2147483648
