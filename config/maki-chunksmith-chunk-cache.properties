# Compatibility fingerprint policy for maki-chunksmith-chunk-cache 1.1.x.
# Unknown MODs and config/datapack files remain compatibility-relevant by default.
# Only list a MOD here when it is demonstrably observation/UI/diagnostic-only and cannot change generated chunk data.
fingerprint.observation-only-mod-ids=maki_lag_observer

# Server-root relative paths that are known not to affect worldgen/serialization.
# Supports exact paths, '*' within a single path segment, and a trailing '/**' subtree rule.
# config/chunksmith/tasks/** is always excluded internally because it is mutable task progress.
fingerprint.ignore-paths=config/maki-lag-observer.properties

# Incompatible generations are moved under
# world/chunksmith_chunk_cache/<dimension>/.quarantine/ instead of being deleted immediately.
quarantine.retention-days=30
quarantine.max-generations=8
quarantine.max-bytes=53687091200
# Capacity pruning never automatically removes a freshly quarantined generation before this age.
quarantine.min-protection-hours=24
