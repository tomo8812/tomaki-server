# Compatibility fingerprint policy for maki-chunksmith-chunk-cache.
# Unknown MODs, configs, datapacks, and generation inputs remain compatibility-relevant by default.
# Cache serialization schema is validated per entry and is not a world-generation fingerprint input.

# Server-root relative paths that are known not to affect generated chunk contents.
# Supports exact paths, '*' within a single path segment, and a trailing '/**' subtree rule.
# config/chunksmith/tasks/** is always excluded internally because it is mutable task progress.
fingerprint.ignore-paths=config/maki-mods-observer.properties

# Optional comma-separated MOD IDs explicitly audited by the operator as generation-neutral.
# Built-in contracts already cover maintained operational/UI/ship MODs. Known terrain/structure/
# worldgen IDs are protected and remain relevant even if accidentally listed here.
fingerprint.generation-neutral-mod-ids=

# Historical/quarantined data is never deleted automatically. These thresholds only emit warnings.
# Irreversible deletion remains an explicit administrator action.
quarantine.warn-generations=8
quarantine.warn-bytes=53687091200

# Cache write admission. Leave room for authoritative normal world/entity/POI saves.
# Under pressure, new cache writes stop rather than deleting retained cache generations.
cache.max-active-bytes=21474836480
cache.minimum-free-bytes=2147483648
