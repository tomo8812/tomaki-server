# Compatibility fingerprint policy for maki-chunksmith-chunk-cache.
# Compatibility tracks generated-result inputs, not cache-format bytes.
# Unknown MODs/configuration remain fail-closed because code-only worldgen cannot be inferred from resources.
# Known scheduling/UI/diagnostic custom MOD roles are neutral in code; additional neutral config paths are explicit here.

# Server-root relative paths proven not to affect generated results.
fingerprint.ignore-paths=config/maki-mods-observer.properties,config/maki-lod-cpu.properties,config/maki-diorama-share-client.toml,config/chunksmith/config.json,config/millenaire-common.toml

# Extra code-driven MOD ids and configuration paths that affect terrain/structures/biomes/villages.
# Use these for a worldgen MOD whose generation effect cannot be detected from datapack resources.
fingerprint.generation-sensitive-mod-ids=
fingerprint.generation-sensitive-paths=

# Incompatible generations are moved under
# world/chunksmith_chunk_cache/<dimension>/.quarantine/ instead of being deleted immediately.
quarantine.retention-days=30
quarantine.max-generations=8
quarantine.max-bytes=53687091200
# Capacity pruning never automatically removes a freshly quarantined generation before this age.
quarantine.min-protection-hours=24

# Combined active pregen FULL-cache + Chunksmith LOD admission (separate from quarantine retention).
# Leave room for authoritative normal world/entity/POI saves. No automatic active-data eviction.
cache.max-active-bytes=16106127360
cache.minimum-free-bytes=2147483648
