# FULL chunk-cache policy. This MOD owns FULL cache reuse only.
# Chunksmith owns LOD format compatibility and reuse.
#
# FULL reuse is based on Minecraft DataVersion, world seed/generator,
# current world-generation MODs, their effective terrain configuration,
# and datapacks. Ordinary scheduling, village deferral, UI and other
# non-worldgen MOD/config updates do not invalidate cached FULL chunks.
#
# When adding or changing a terrain generator, update FingerprintPolicy.java
# in the same change. No generic future-MOD compatibility configuration.

# Incompatible generations are retained separately until normal cleanup.
quarantine.retention-days=30
quarantine.max-generations=8
quarantine.max-bytes=53687091200
quarantine.min-protection-hours=24

# Storage admission protects authoritative normal-world/entity/POI saves.
cache.max-active-bytes=16106127360
cache.minimum-free-bytes=2147483648
